id:"D58",deck:"s10",tag:"심혈관 · 응고 · 통풍 추가",q:"Heparin (unfractionated)",ko:"",a:"## Class\nanticoagulant\n## Indication · Mechanism\nVTE prevention (SC) or treatment (IV infusion). Inactivates thrombin and Xa via antithrombin.\n트롬빈 · Xa 억제\n## Side effects · Nursing\n• Bleeding, HIT\n• IV infusion adjusted by APTT\n• reversal: protamine\n출혈, HIT, IV는 APTT로 조절",key:""},{id:"D59",deck:"s10",tag:"심혈관 · 응고 · 통풍 추가",q:"Digoxin",ko:"",a:"## Class\ncardiac glycoside\n## Indication · Mechanism\nAF rate control, HF. Slows AV conduction, strengthens contraction.\n방실 전도 느리게, 수축력 ↑\n## Side effects · Nursing\n• Toxicity: nausea, vision changes, bradycardia, confusion\n• apical HR 1 min before giving, withhold & report if low (per policy)\n• low K+ ↑ toxicity\n주기 전 심첨맥박 1분, 저칼륨 시 독성 ↑",key:""},{id:"D60",deck:"s10",tag:"심혈관 · 응고 · 통풍 추가",q:"Spironolactone",ko:"",a:"## Class\nK+-sparing diuretic (aldosterone antagonist)\n## Indication · Mechanism\nHF, oedema, ascites. Blocks aldosterone → Na out, K+ kept.\n알도스테론 차단\n## Side effects · Nursing\n• High K+ (esp. with ACE inhibitors), gynaecomastia, kidney function\n• check K+\n고칼륨, 칼륨 수치 확인 · Day 2",key:""},{id:"D61",deck:"s10",tag:"심혈관 · 응고 · 통풍 추가",q:"Potassium chloride (Slow-K, Span-K)",ko:"",a:"## Class\nelectrolyte\n## Indication · Mechanism\nLow K+, often with loop diuretics. Replaces potassium.\n칼륨 보충\n## Side effects · Nursing\n• GI irritation\n• swallow whole with food & water, sit upright\n• check K+\n• IV KCl is high-risk\n위장 자극, 통째로, 음식 · 물과, IV KCl 고위험",key:""},{id:"D62",deck:"s10",tag:"심혈관 · 응고 · 통풍 추가",q:"Allopurinol",ko:"",a:"## Class\nxanthine oxidase inhibitor\n## Indication · Mechanism\nLong-term gout prevention. Lowers uric acid production.\n요산 생성 ↓\n## Side effects · Nursing\n• Rash → stop & report (can be serious)\n• may trigger a flare when started\n• not for acute attacks\n• dose by kidney function\n발진 시 중단 · 보고, 급성 발작 치료용 아님",key:""},{id:"D63",deck:"s11",tag:"기타 자주 보는 약",q:"Salbutamol (Ventolin)",ko:"",a:"## Class\nSABA\n## Indication · Mechanism\nAcute wheeze/bronchospasm. β2 stimulation relaxes airway muscle.\n기관지 근육 이완\n## Side effects · Nursing\n• Tremor, fast HR, low K+\n• check spacer technique\n떨림, 빈맥, spacer 사용법 · Day 8",key:""},{id:"D64",deck:"s11",tag:"기타 자주 보는 약",q:"Cephalexin (Keflex)",ko:"",a:"## Class\n1st-gen cephalosporin\n## Indication · Mechanism\nCellulitis, UTI. Stops bacteria building cell walls.\n세균 세포벽 합성 억제\n## Side effects · Nursing\n• Diarrhoea, C. diff, allergy (ask about penicillin allergy)\n• give on time, finish course\n설사, 알레르기 확인 · Day 5",key:""},{id:"D65",deck:"s11",tag:"기타 자주 보는 약",q:"Donepezil (Aricept)",ko:"",a:"## Class\ncholinesterase inhibitor\n## Indication · Mechanism\nAlzheimer's dementia. ↑ acetylcholine in the brain.\n뇌 아세틸콜린 ↑\n## Side effects · Nursing\n• Nausea, slow HR, vivid dreams\n• falls from bradycardia/syncope\n오심, 서맥, 낙상 · Day 10",key:""},{id:"D66",deck:"s11",tag:"기타 자주 보는 약",q:"Melatonin (Circadin)",ko:"",a:"## Class\nsleep hormone\n## Indication · Mechanism\nInsomnia in older people. Mimics the body's sleep hormone.\n수면 호르몬 보충\n## Side effects · Nursing\n• Mild drowsiness, headache\n• give 1–2 h before bed\n• safer than benzodiazepines\n가벼운 졸림, 취침 1–2시간 전",key:""},{id:"D67",deck:"s11",tag:"기타 자주 보는 약",q:"Haloperidol",ko:"",a:"## Class\ntypical antipsychotic\n## Indication · Mechanism\nShort-term severe agitation in delirium (low dose). Blocks dopamine.\n도파민 차단\n## Side effects · Nursing\n• Stiffness/tremor (EPS), QT, sedation\n• avoid in Parkinson's & Lewy body dementia\n추체외로 증상, Parkinson's 금지 · Day 10",key:""},{id:"D68",deck:"s11",tag:"기타 자주 보는 약",q:"Naloxone",ko:"",a:"## Class\nopioid antagonist\n## Indication · Mechanism\nOpioid toxicity (sedation 3, low RR). Displaces opioid from receptors.\nopioid 수용체에서 밀어냄\n## Side effects · Nursing\n• Sudden pain/withdrawal\n• shorter acting than opioids → keep monitoring for re-sedation\n갑작스런 통증, 다시 졸릴 수 있어 계속 관찰 · Day 11",key:""},{id:"D69",deck:"s11",tag:"기타 자주 보는 약",q:"Metoclopramide (Maxolon)",ko:"",a:"## Class\ndopamine antagonist antiemetic\n## Indication · Mechanism\nNausea, slow stomach emptying. Blocks dopamine, speeds gut movement.\n도파민 차단, 위 배출 촉진\n## Side effects · Nursing\n• Restlessness, EPS\n• avoid in Parkinson's\n안절부절, Parkinson's 금지",key:""},{id:"D70",deck:"s11",tag:"기타 자주 보는 약",q:"Prochlorperazine (Stemetil)",ko:"",a:"## Class\nphenothiazine antiemetic\n## Indication · Mechanism\nNausea, vertigo. Blocks dopamine.\n도파민 차단\n## Side effects · Nursing\n• Sedation, EPS, postural drop\n• avoid in Parkinson's\n진정, 기립성 저혈압, Parkinson's 금지",key:""},{id:"K01",deck:"s12",tag:"공통 포인트",q:"Rehab 약 Key checks 5가지",ko:"공통 포인트",a:"1. Opioid → laxative charted? (변비약 있나)\n2. NSAID/aspirin → PPI? (PPI 있나)\n3. SSRI/SNRI + tapentadol/tramadol → serotonin syndrome (주의)\n4. More sedatives, BP drugs and diuretics = higher falls risk (낙상 위험 ↑)\n5. Never crush SR/XR/CR. (서방형 갈지 않기)",key:""},{id:"T00",deck:"s12",tag:"약 용어",q:"Agonist vs Antagonist vs Inhibitor",ko:"작용제 · 길항제 · 억제제",a:"an agonist switches a receptor ON, an antagonist blocks a receptor (switches it OFF), and an inhibitor stops an enzyme or a process.\nagonist = 수용체를 켜는 약 · 작용제\nantagonist = 수용체를 막는 약 · 길항제\ninhibitor = 효소나 과정을 멈추는 약 · 억제제",key:""},{id:"T01",deck:"s12",tag:"약 용어",q:"SR (sustained release · 서방형)",ko:"",a:"## 뜻\nTablet releases the drug slowly over 12–24 h → steady level, fewer doses. Never crush or chew → whole dose released at once = overdose. XR (extended release), CR (controlled release), MR (modified release) mean the same.\n천천히 녹아 오래 작용. 갈거나 씹으면 한 번에 다 나와 과량 위험. XR · CR · MR도 같은 뜻\n## 예시 약\nPalexia SR, Targin, Panadol Osteo, Efexor-XR",key:""},{id:"T02",deck:"s12",tag:"약 용어",q:"IR (immediate release · 속방형)",ko:"",a:"## 뜻\nReleases the drug straight away → works fast (30–60 min) but wears off sooner. Used PRN for breakthrough pain.\n바로 녹아 빨리 작용, 짧게 지속. 돌발통 PRN용\n## 예시 약\nTapentadol IR, Endone (oxycodone IR), tramadol IR",key:""},{id:"T03",deck:"s12",tag:"약 용어",q:"SNRI (serotonin–noradrenaline reuptake inhibitor · 세로토닌 · 노르아드레날린 재흡수 억제제)",ko:"",a:"## 뜻\nStops nerves taking back serotonin and noradrenaline → more of them in the gap between nerves → mood ↑ and pain signals in the spinal cord ↓.\n신경 사이에 세로토닌 · 노르아드레날린이 오래 남아 기분 ↑, 통증 신호 ↓\n## 예시 약\nDuloxetine, venlafaxine",key:""},{id:"T04",deck:"s12",tag:"약 용어",q:"Gabapentinoid (gabapentin 계열)",ko:"",a:"## 뜻\nDrugs built like gabapentin. Bind the α2δ part of nerve calcium channels → overactive, damaged nerves fire less → nerve pain ↓.\n손상돼 과하게 흥분한 신경을 진정시켜 신경통 ↓\n## 예시 약\nPregabalin, gabapentin",key:""},{id:"T05",deck:"s12",tag:"약 용어",q:"Anti-gout (통풍 약)",ko:"",a:"## 뜻\nGout = uric acid crystals in a joint → sudden hot, red, painful joint. Some drugs calm the attack, others lower uric acid long-term.\n통풍 = 관절에 요산 결정. 발작 치료용과 예방용이 따로 있음\n## 예시 약\nColchicine (attack · 발작), allopurinol (prevention · 예방)",key:""},{id:"T06",deck:"s12",tag:"약 용어",q:"DMARD (disease-modifying antirheumatic drug · 질병 조절 항류마티스제)",ko:"",a:"## 뜻\nSlows the disease itself in rheumatoid arthritis and protects joints from damage, not just pain relief. Takes weeks to work; lowers immunity → infection risk.\nRA 자체의 진행을 늦춰 관절 보호. 효과는 몇 주 후, 면역 ↓ → 감염 주의\n## 예시 약\nMethotrexate, adalimumab (biologic · 생물학적), upadacitinib (JAK)",key:""},{id:"T07",deck:"s12",tag:"약 용어",q:"ICS (inhaled corticosteroid · 흡입 스테로이드)",ko:"",a:"## 뜻\nSteroid breathed straight into the lungs → airway inflammation ↓ with few whole-body effects. Preventer, not reliever. Rinse mouth after → prevents thrush.\n기도 염증 ↓. 예방용, 흡입 후 입 헹구기\n## 예시 약\nBudesonide (in Symbicort), fluticasone",key:""},{id:"T08",deck:"s12",tag:"약 용어",q:"LABA (long-acting beta-2 agonist · 지속형 베타2 작용제)",ko:"",a:"## 뜻\nSwitches on β2 receptors on airway muscle → muscle relaxes → airways stay open 12–24 h. Short-acting version = SABA (salbutamol).\n기도 근육 β2를 켜서 12–24시간 기관지 확장\n## 예시 약\nEformoterol, olodaterol, salmeterol",key:""},{id:"T09",deck:"s12",tag:"약 용어",q:"LAMA (long-acting muscarinic antagonist · 지속형 무스카린 길항제)",ko:"",a:"## 뜻\nBlocks acetylcholine's muscarinic receptors on airway muscle → airway can't tighten → open for 24 h. Mainly COPD.\n아세틸콜린 수용체를 막아 기도 수축 ↓, 24시간 확장\n## 예시 약\nTiotropium (Spiriva, Spiolto)",key:""},{id:"T10",deck:"s12",tag:"약 용어",q:"GABA-B agonist (GABA-B 작용제)",ko:"",a:'## 뜻\nGABA is the brain and spinal cord\'s "calm down" messenger. Switching on GABA-B in the spinal cord → fewer signals to tight muscles → spasticity ↓.\nGABA = 신경을 진정시키는 물질. 척수에서 근육 경직 ↓\n## 예시 약\nBaclofen',key:""},{id:"T11",deck:"s12",tag:"약 용어",q:"5-HT3 antagonist (antiemetic) (5-HT3 길항제 · 항구토제)",ko:"",a:"## 뜻\n5-HT3 = a serotonin receptor in the gut and the brain's vomiting centre. Blocking it → nausea and vomiting ↓. Antiemetic = anti-vomiting drug.\n장 · 뇌 구토 중추의 세로토닌 수용체 차단 → 오심 ↓\n## 예시 약\nOndansetron",key:""},{id:"T12",deck:"s12",tag:"약 용어",q:"Bisphosphonate (비스포스포네이트)",ko:"",a:"## 뜻\nSticks to bone and stops osteoclasts (bone-breaking cells) → bone loss ↓, fracture risk ↓. Oral: empty stomach, full glass of water, upright 30 min (protects the oesophagus).\n뼈를 녹이는 세포 억제 → 골밀도 유지. 공복, 물 한 컵, 30분 세워 앉기\n## 예시 약\nAlendronate (Fosamax), risedronate, zoledronic acid (IV)",key:""},{id:"T13",deck:"s12",tag:"약 용어",q:"RANKL inhibitor (RANKL 억제제)",ko:"",a:"## 뜻\nRANKL = the signal that switches osteoclasts on. Antibody blocks it → bone breakdown ↓. Can cause low calcium.\n파골세포를 켜는 신호 RANKL 차단, 저칼슘 주의\n## 예시 약\nDenosumab (Prolia)",key:""},{id:"T14",deck:"s12",tag:"약 용어",q:"Anticholinergic (항콜린제)",ko:"",a:'## 뜻\nBlocks acetylcholine, the "rest and digest" messenger → dry mouth, constipation, urine retention, blurred vision, confusion & falls in older people. Many drugs have this effect.\n아세틸콜린 차단 → 입 마름, 변비, 요정체, 노인 혼란 · 낙상\n## 예시 약\nOxybutynin, tiotropium, some antihistamines',key:""},{id:"T15",deck:"s12",tag:"약 용어",q:"Corticosteroid (코르티코스테로이드)",ko:"",a:"## 뜻\nMan-made version of cortisol, the body's stress hormone → strong anti-inflammatory and immune suppression. Long use: high BGL, infection, bone loss; don't stop suddenly.\n코르티솔과 같은 작용 → 강한 항염 · 면역 억제. 갑자기 끊지 않기\n## 예시 약\nPrednisolone, dexamethasone, budesonide",key:""},{id:"T16",deck:"s12",tag:"약 용어",q:"Cardiac glycoside (강심배당체)",ko:"",a:"## 뜻\nHeart drug first taken from the foxglove plant. Heart squeezes harder + AV node conducts slower → HR ↓. Narrow safe range → check apical HR.\n심장 수축력 ↑, 맥박 ↓. 안전 범위 좁음\n## 예시 약\nDigoxin",key:""},{id:"T17",deck:"s12",tag:"약 용어",q:"K+-sparing diuretic (aldosterone antagonist) (칼륨 보존 이뇨제 · 알도스테론 길항제)",ko:"",a:"## 뜻\nAldosterone = hormone that keeps Na+ and water and gets rid of K+. Blocking it → Na+ and water out, K+ kept → risk of high K+.\n알도스테론 차단 → 소변 ↑, 칼륨은 남음 → 고칼륨 주의\n## 예시 약\nSpironolactone, eplerenone",key:""},{id:"T18",deck:"s12",tag:"약 용어",q:"Cholinesterase inhibitor (콜린에스테라아제 억제제)",ko:"",a:"## 뜻\nCholinesterase = enzyme that breaks down acetylcholine. Blocking it → more acetylcholine in the brain → memory and thinking helped a little in dementia. Can slow HR.\n아세틸콜린 분해 효소 억제 → 뇌 아세틸콜린 ↑, 서맥 주의\n## 예시 약\nDonepezil, rivastigmine (patch)",key:""},{id:"T19",deck:"s12",tag:"약 용어",q:"Phenothiazine (페노티아진계)",ko:"",a:"## 뜻\nAn older chemical family that blocks dopamine. Low dose for nausea and vertigo. Can cause stiffness/tremor (EPS) → avoid in Parkinson's.\n도파민 차단 계열. 오심 · 어지럼증에 사용, Parkinson's 금지\n## 예시 약\nProchlorperazine (Stemetil), chlorpromazine",key:""}]})</script><script>(()=>{const t=window.PACKS;let e,n,a,s;const i=t=>document.getElementById(t),o=matchMedia("(hover: none) and (pointer: coarse)").matches;document.documentElement.classList.add(o?"touch":"no-touch");const r=t=>{try{navigator.vibrate?.(t)}catch{}},d={get(t,e){try{const n=localStorage.getItem("recall:"+t);return n?JSON.parse(n):e}catch{return e}},set(t,e){try{localStorage.setItem("recall:"+t,JSON.stringify(e))}catch{}}};let c=d.get("mastery",{}),l=d.get("seen",{}),u=d.get("prefs",{shuffle:!1,weak:!1,theme:null});u.decks||={};for(const
