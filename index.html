SCUH, I had a great experience and learned a lot from the nursing team.\nI share the hospital's values, especially compassion, accountability and innovation.\nI enjoy caring for patients, take responsibility for my work and always try to learn and improve.\nI would love the opportunity to support the nursing team and provide safe, compassionate care to patients.",key:"기여 + 학습 + 안전 · Values: Integrity · Compassion · Accountability · Innovation"},{id:"R2",deck:"real",tag:"실제 질문",q:"What is an area you need to improve? / What will be challenging?",ko:"도전할 점 · 보완할 점",a:"I sometimes spend too much time checking details because I want to get things right.\nI'm working on this by setting priorities and managing my time better.",key:"약점: 디테일 확인에 시간 많이 씀(제대로 하고 싶어서) → 개선: 우선순위 · 시간관리"},{id:"R3",deck:"real",tag:"실제 질문",q:"Where are you currently working?",ko:"어디에서 일하고 있는지",ref:"01.03",a:"I'm a second-year nursing student at UniSC and I work as an AIN at [Regis / Arcare] Maroochydore.\nHospital placements have improved my observations, communication and teamwork.",key:"⚠ 원본에 Arcare(07.01)와 Regis(01.03)가 섞여 있음 — 실제 근무지로 통일"},{id:"R4",deck:"real",tag:"실제 질문",q:"How can you show compassion as a USIN?",ko:"USIN으로서 compassion을 보여주는 방법",a:"As a USIN, I would show compassion by listening to patients, acknowledging their feelings, and treating them with dignity and respect.\nIf a patient felt embarrassed during personal care, I would protect their privacy, explain what I was doing, and give them time.\nI would also report any pain or concerns to the RN so they could receive appropriate support.",key:"경청 · 감정 인정 · 존엄·존중 → 예: 개인위생 중 부끄러워하면 privacy·설명·시간 → 통증·걱정은 RN 보고"},{id:"R5",deck:"real",tag:"실제 질문",q:"Tell us about a time you worked as part of a team under pressure.",ko:"압박 속에서 팀의 일원으로 일했던 경험",a:"Usually, four staff work in that wing, but that day there were only two of us, including me.\nWe had to prioritise tasks and plan our rounds to work as efficiently as possible.\nIt was challenging, but we used our time well and asked staff from another wing for help. In the end, we completed our work successfully.\nIt was a tough but rewarding day.",key:"상황: 보통 4명 → 그날 2명 · 행동: 우선순위·라운드 계획, 다른 wing에 도움 요청 · 결과: 일 다 끝냄 · 힘들었지만 보람"},{id:"R6",deck:"real",tag:"실제 질문",q:"Is there anything you'd like to tell us about your application?",ko:"지원서에 대해 할 말?",ref:"01.06",a:"In aged care, I provide personal care and report changes to the RN.\nOn placement, I also help with observations and team care.",key:"직접 간호 · 변화 보고 · 일관된 케어"},{id:"R7",deck:"real",tag:"실제 질문",q:"Do you have a Blue Card? Do you have any holidays planned?",ko:"블루카드 / 홀리데이 예정",ref:"02.12",a:"Yes, I have a current Blue Card. [만료일 확인]\nI don't have any holidays planned at the moment. [예정 있으면 날짜]\nI would confirm my availability around study, placements and visa limits.",key:"[ ] 부분은 본인 상황으로 채우기 · 실제 요일·시작일 준비"},{id:"02.11",deck:"real",tag:"실제 질문",q:"How do you show compassion and demonstrate our values?",ko:"병원 가치 적용",a:"I really enjoy learning new things. Whenever I'm unsure about something, I ask experienced nurses for guidance and check my understanding with them.\nI would demonstrate these values by respecting each patient's dignity, privacy and choices.\nI would be reliable, follow through on my responsibilities, and provide care based on each patient's individual needs.\nI would also be honest about my limitations and ask for help whenever I'm unsure.",key:"배우는 걸 좋아함 · 모르면 경험 많은 간호사에게 묻고 확인 → 존엄·privacy·선택 존중 → 믿음직·책임 끝까지·개별 간호 → 한계 솔직·도움 요청"},{id:"01.01",deck:"d01",tag:"후기 기출",q:"A patient has fallen and is bleeding. What would you do?",ko:"낙상 후 출혈 환자",a:"## 낙상 O · 출혈 X\nFirst, I would stay calm and make sure the patient is safe. I would not move the patient immediately. Then I would call the RN or follow the hospital procedure. I would observe for pain, bleeding, or any injuries and stay with the patient until help arrives.\n## 낙상 O · 출혈 O\nI would follow the DRSABCD protocol.\nFirst, I would check for danger and make sure the area is safe. Then, I would check the patient's response and call the RN for help.\nNext, I would check their airway and breathing. If the patient is unresponsive and not breathing normally, I would start CPR with 30 chest compressions and 2 rescue breaths, and use an Automated External Defibrillator (AED) as soon as possible.\nIf the patient is bleeding heavily, I would apply firm direct pressure to control the bleeding. I would avoid unnecessary movement and stay with the patient until help arrives.",key:"Danger → Response → Send for help → Airway → Breathing → CPR → AED + Direct pressure for bleeding"},{id:"01.02",deck:"d01",tag:"후기 기출",q:"Tell us about a time you worked with a multidisciplinary team.",ko:"다학제 팀 경험",a:"While working in aged care, I cared for a resident who had fallen twice in one week.\nShe was on a one-person assist mobility plan, but when I went to help her shower, I noticed she was very unsteady and struggled to stand.\nI was worried about another fall, so I reported it to the RN and requested a physiotherapy review.\nThe physiotherapist reassessed her mobility, and her mobility plan was later updated.\nThis experience taught me the importance of noticing changes early and working with other healthcare professionals to prevent falls and keep residents safe.",key:"팀워크 · 관찰 공유 · RN 감독"},{id:"02.09",deck:"d01",tag:"Nambour 기출",q:"How is a USIN different from an AIN?",ko:"USIN과 AIN의 차이",a:"Both AINs and USINs work under RN supervision.\nAn AIN mainly helps with personal care and daily activities.\nA USIN does a bit more. Queensland Health says a USIN works in three areas: vital signs, basic clinical care and personal care.\nFor example, taking obs, checking BGLs, helping with ECGs and wound care, and helping patients with showering, dressing and mobility.\nBut I always follow hospital policy and stay within my scope.",key:"둘 다 RN 감독 · AIN = personal care·daily activities · USIN 3 areas: vital signs / basic clinical care / personal care · 정책·scope"},{id:"02.09b",deck:"d01",tag:"Nambour 기출",q:"Do you know what a USIN does?",ko:"USIN의 업무",a:"Yes. A USIN works under RN supervision.\nQueensland Health says a USIN works in three areas: vital signs, basic clinical care and personal care.\nFor example, taking obs, checking BGLs, helping with ECGs and wound care, and helping patients with showering, dressing and mobility.\nI always follow hospital policy and stay within my scope.",key:"RN 감독 · 3 areas: vital signs / basic clinical care / personal care · 예: obs·BGL·ECG·wound care·shower·dressing·mobility · 정책·scope"},{id:"02.01",deck:"d01",tag:"후기 기출",q:"A patient's BGL is 3 mmol/L. What would you do, including after informing the RN?",ko:"BGL 3.0 mmol/L · 저혈당 후속 조치",a:"A BGL of 3 mmol/L indicates hypoglycaemia, so I would immediately inform the RN and assess the patient's consciousness, swallowing ability and vital signs.\nIf the patient is alert and can swallow safely, I would assist with giving fast-acting carbohydrates, such as 150 mL of orange juice, following the hospital protocol and RN's direction.\nI would recheck the BGL after 15 minutes. If it is still below 4, I would report it and repeat treatment as directed.\nOnce the BGL is above 4 and symptoms have resolved, I would help provide slow-acting carbohydrates, continue monitoring and document the care.\nIf the patient is unconscious or unable to swallow safely, I would give nothing orally and call for emergency assistance.",key:"BGL <4 · RN 즉시 알림 · 의식/삼킴 확인 · 빠른 당(정책) · 15분 재검 · 관찰/보고 · mmol/L = millimoles per litre"},{id:"02.08",deck:"d01",tag:"Nambour 기출",q:"What can cause delirium, and how would you care for a patient with dementia or delirium?",ko:"치매·섬망 환자 간호",ref:"05.01–05.02",a:"Delirium can be caused by pain, infection, dehydration, constipation, hunger, the environment or medications.\nFirst, I would make sure the patient is safe right now.\nThen I would check their care plan, because it may show what triggers them or any other mental health problems.\nNext, I would do a 4AT assessment. It checks alertness, orientation by asking their name and date of birth, attention by asking them to say the months backwards from December, and any acute change in their mental state.\nA score of 4 or more means possible delirium, so further clinical assessment is needed. A score of 1 to 3 means possible cognitive impairment.\nI would report the result to the RN.",key:"원인 PITCHED: Pain / Infection / Thirst / Constipation / Hunger / Environment / Drugs · 안전 확인 → care plan(트리거·다른 정신 문제) → 4AT: Alertness / 이름·DOB / 12월부터 거꾸로 / 급성 변화 → ≥4 섬망 가능성·추가 임상평가, 1–3 인지장애 가능성 → RN 보고"},{id:"01.03",deck:"d01",tag:"후기 기출",q:"Tell us about your relevant experience.",ko:"관련 경력 · 이력서 설명",a:"I'm a second-year nursing student at UniSC and an AIN at Regis Maroochydore. Hospital placements have improved my observations, communication and teamwork.",key:"현재 근무 · 실습과 유급 업무 구분 · ⚠ 07.01은 Arcare로 되어 있음"},{id:"01.04",deck:"d01",tag:"후기 기출",q:"What would you do if you had a problem with a colleague?",ko:"동료와 갈등",a:"I would stay calm and speak with my colleague privately and respectfully.\nI would listen to their point of view and try to find a solution together.\nIf we couldn't resolve the issue or patient safety was at risk, I would report it to the RN.\nI believe good communication and teamwork are important for patient safety.",key:"안전 → 비공개 대화 → 상급자"},{id:"01.05",deck:"d01",tag:"후기 기출",q:"How would you handle a difficult situation?",ko:"어려운 상황 대처",a:"I would stay calm, put patient safety first and ask the RN for help early. Afterwards, I would learn from feedback.",key:"실제 사례 요구 시 10.05 연결"},{id:"01.06",deck:"d01",tag:"후기 기출",q:"Your CV mentions this experience: what did you contribute, and why was it important?",ko:"이력서 → 기여 → 중요성",a:"In aged care, I provide personal care and report changes to the RN. On placement, I also help with observations and team care.",key:"직접 간호 · 변화 보고 · 일관된 케어"},{id:"03.01",deck:"d03",tag:"예상",q:"Would you help the patient straight back into bed?",ko:"바로 일으켜도 되나?",a:"I would not lift them straight back into bed. I would call the RN and wait for assessment unless movement was needed for immediate safety.",key:"무조건 이동 금지로 외우지 않기 · 생명구조·안전 목적 예외"},{id:"03.02",deck:"d03",tag:"예상",q:"What if bleeding does not stop?",ko:"지혈이 안 되면?",a:"I would apply firm direct pressure and call for urgent help. I would watch for shock and follow the emergency team's instructions.",key:"지혈 위치·압박 확인 · 계속 패드만 쌓지 않기"},{id:"03.03",deck:"d03",tag:"예상",q:"What if the patient hit their head or takes anticoagulants?",ko:"머리 충격 · 항응고제",a:"I would urgently tell the RN about the head strike and any blood thinners. I would monitor for drowsiness, vomiting or other changes.",key:"숨은 출혈 · 신경학적 변화"},{id:"03.04",deck:"d03",tag:"예상",q:"What observations and follow-up are needed after a fall?",ko:"낙상 후 확인",a:"I would help with observations, pain and injury checks. I would report changes, follow the monitoring plan and document care.",key:"사실 · baseline · 관찰 계획"},{id:"03.06",deck:"d03",tag:"예상",q:"How would you prevent another fall?",ko:"재낙상 예방",a:"I would follow the falls and mobility plan, remove hazards and keep the call bell within reach. I would help with toileting and report dizziness.",key:"개별 계획 · 환경 · 화장실 · 변화 보고"},{id:"02.02",deck:"d03",tag:"후기 기출",q:"A patient with dementia has fallen. How would you keep them calm while waiting for the RN?",ko:"치매 환자 낙상 · 진정·안전",a:"I would call the RN, check for injuries and avoid moving the patient. I would speak calmly, reassure them and watch for changes.",key:"불필요한 이동 금지 · 눈높이·짧은 말·조용한 환경 · 계속 관찰 · RN 인계"},{id:"02.05",deck:"d03",tag:"Nambour 기출",q:"You find a patient on the floor. What would you do if they were conscious versus unconscious?",ko:"바닥에서 발견 · 의식 있음 vs 없음",a:"I would check safety, call for help and use DRSABCD.\nIf conscious, I would check injuries and bleeding; if unconscious but breathing, protect the airway and avoid unnecessary movement.\n## DRSABCD\nD — Danger: check safety\nR — Response: check if they respond\nS — Send for help: call the RN / emergency team\nA — Airway: open and check it\nB — Breathing: check normal breathing\nC — CPR: start 30 compressions and 2 breaths if unresponsive and not breathing normally\nD — Defibrillation: use an AED as soon as available",key:"의식 있음: 안심·부상·지혈 → 의식 없음+호흡: 기도 유지·관찰 → 호흡 없음: CPR 30:2·AED → 인계"},{id:"04.01",deck:"d04",tag:"예상",q:"A patient's condition is deteriorating. What do you do?",ko:"급성 악화",a:"I would immediately call the RN and use the ABCDE primary survey to identify any life-threatening problems.\nI would check Airway for obstruction, Breathing for respiratory rate and oxygen saturation, and Circulation for pulse, blood pressure and bleeding. Then I would assess Disability, including consciousness and BGL, and Exposure for injuries, temperature or other signs of deterioration.\nI would stay with the patient, monitor and report my findings within my scope, and support the emergency response as directed by the RN.",key:"도움 · ABCDE · 관찰 추세 · ISBAR"},{id:"04.02",deck:"d04",tag:"예상",q:"The score is low, but you are still worried. What then?",ko:"점수 낮아도 걱정되면?",a:"I would trust my clinical concern, not just the score. I would tell the RN, explain the changes and escalate again if needed.",key:"숫자만 기다리지 않기"},{id:"04.03",deck:"d04",tag:"예상",q:"A patient suddenly becomes short of breath.",ko:"갑작스러운 호흡곤란",a:"I would stop activity, sit them upright if safe and call the RN. I would check breathing and SpO₂ and escalate severe distress.",key:"호흡 · SpO₂ · 응급도 · 산소 권한"},{id:"04.04",deck:"d04",tag:"예상",q:"A patient develops chest pain.",ko:"흉통",a:"I would stop activity, keep the patient resting and urgently call the RN. I would check observations and help with an ECG if authorised.",key:"활동 중단 · 즉시 보고 · ECG 보조"},{id:"04.05",deck:"d04",tag:"예상",q:"You suspect sepsis. What do you look for and do?",ko:"패혈증 의심",a:"I would look for signs of sepsis, such as fever, rapid breathing, low blood pressure and new confusion.\nI would check for red flags, including RR ≥25, systolic BP below 90 and altered mental state.\nI would immediately inform the RN, follow the hospital's sepsis escalation protocol, and continue monitoring the patient within my scope.",key:"감염 + 악화 → 즉시 보고 · 처방·수액은 독자 시행 안 함"},{id:"04.06",deck:"d04",tag:"예상",q:"A patient has facial droop, arm weakness or speech changes.",ko:"뇌졸중 의심",a:"I would activate the stroke response for new face, arm or speech changes. I would report last known well time and withhold oral intake.",key:"FAST · last known well · 경구 보류"},{id:"04.07",deck:"d04",tag:"예상",q:"A patient has a seizure.",ko:"경련",a:"I would call for help, time the seizure and protect the patient. I would not restrain them or put anything in their mouth, and check breathing afterwards.",key:"시간 · 손상 예방 · 억제·입 삽입 금지"},{id:"04.08",deck:"d04",tag:"예상",q:"A patient starts choking while eating.",ko:"기도폐쇄",a:"If they can cough, encourage coughing. If choking is severe, call for help and give up to five back blows, then five chest thrusts; start CPR if needed.",key:"효과적 기침 vs 심한 폐쇄 · 호주: back blows · chest thrusts"},{id:"04.09",deck:"d04",tag:"예상",q:"A patient becomes very drowsy after an opioid.",ko:"오피오이드 후 졸림·호흡저하",a:"I would call the RN urgently for unusual drowsiness or slow breathing after opioids. I would check breathing and report the drug and time given.",key:"졸림·호흡수 중요 · 투약명·시간 전달"},{id:"02.06",deck:"d04",tag:"후기 기출",q:"What could you do during an emergency before the RN arrives?",ko:"응급 상황에서 USIN의 역할",a:"I would activate the emergency response and check response and breathing. I would support the airway and start CPR with an AED if needed, then help the team within my scope.",key:"도움 요청 · DRSABCD · CPR/AED · 관찰·인계 · 역할 범위"},{id:"05.01",deck:"d05",tag:"예상",q:"How is delirium different from dementia?",ko:"섬망 · 치매 차이",a:"Delirium starts suddenly and fluctuates; dementia usually develops slowly. I would report any sudden change from the patient's normal state.",key:"갑작스러움 · 변동 · 주의력"},{id:"05.02",deck:"d05",tag:"예상",q:"A patient is distressed or aggressive.",ko:"초조 · 공격적 행동",a:"I would stay calm, give space and check for pain or other needs. I would call the RN if concerned or if safety was at risk.",key:"안전 · de-escalation · 원인 · 도움"},{id:"05.03",deck:"d05",tag:"예상",q:"A patient refuses care.",ko:"간호 거부",a:"I would listen, explain care and offer choices. I would respect their decision and tell the RN about the refusal or risks.",key:"동의 · 이유 · 대안 · RN 보고"},{id:"05.04",deck:"d05",tag:"예상",q:"How would you assess and respond to pain?",ko:"통증",a:"I would assess the patient's pain using PQRST.\nP stands for Provocation: what makes the pain better or worse. Q is Quality: what the pain feels like, such as sharp or dull. R is Region: where the pain is and whether it spreads. S is Severity: rating the pain from 0 to 10. T is Time: when it started and how long it lasts.\nI would report my findings to the RN, provide comfort measures within my scope, and reassess the pain after interventions.",key:"PQRST → RN 보고 → 중재 → 재평가"},{id:"05.05",deck:"d05",tag:"예상",q:"How do you prevent pressure injuries?",ko:"욕창 예방",a:"I would follow the patient's repositioning plan to reduce pressure on their skin.\nDuring personal care, such as showering, I would check for any skin changes, especially redness or skin damage.\nI would also apply moisturising cream as per the care plan to keep their skin healthy.\nIf I noticed any skin changes, I would report them to the RN immediately and document my findings.",key:"개별 체위변경 · 피부 · 영양"},{id:"05.06",deck:"d05",tag:"예상",q:"A patient coughs when drinking. What would you do?",ko:"흡인 · 연하장애 의심",a:"I would stop oral intake, keep them upright if safe and call the RN. I would get urgent help for serious breathing trouble.",key:"경구 중단 · RN · 연하 계획 확인"},{id:"05.07",deck:"d05",tag:"예상",q:"You notice low urine output or a catheter stops draining.",ko:"소변량 감소 · 도뇨관",a:"I would report low urine output and check the amount and tubing if authorised. I would not flush the catheter or give extra fluids myself.",key:"기록 · 통증 · 튜브 · 체액 제한 확인"},{id:"05.08",deck:"d05",tag:"예상",q:"You see a wound dressing soaked with blood after surgery.",ko:"수술 후 출혈",a:"I would urgently tell the RN, check observations and watch for shock. I would report bleeding and help with wound care as directed.",key:"출혈 추세 · 쇼크 · 긴급 보고"},{id:"02.03",deck:"d05",tag:"후기 기출",q:"How would you provide hygiene care for a stroke patient, maintain their dignity and perform skin checks?",ko:"뇌졸중 환자 위생 · 존엄성 · 피부 점검",a:"I would check the care plan, gain consent and protect privacy. I would support the weak arm, check pressure areas and report any skin damage.",key:"계획·동의·프라이버시 · 마비측 어깨 보호 · 뼈 돌출부 확인 · 손상 시 RN 보고·기록"},{id:"06.01",deck:"d06",tag:"예상",q:"What are the three main areas of the USIN scope?",ko:"USIN 업무 범위 3가지",a:"A USIN helps with observations, approved basic clinical tasks and personal care under RN supervision. I would only do tasks within policy and my competency.",key:"활력징후 T·P·BP / ECG·BGL·상처 / 샤워·옷·식사·이동"},{id:"06.02",deck:"d06",tag:"예상",q:"An RN asks you to do something you have never done.",ko:"처음인 업무를 지시하면?",a:"I would say I haven't been assessed as competent and check with the RN. I would not do the task without approval and supervision.",key:"모른다고 말하기 · 권한 · 역량"},{id:"06.03",deck:"d06",tag:"예상",q:"Can you administer medication or manage an IV as a USIN?",ko:"투약 · IV 가능한가?",a:"I would check USIN policy and my competency first. Placement experience alone does not authorise medications or IV tasks at work.",key:"일괄 허용·금지 단정 금지 · 지역 정책·검증·감독"},{id:"06.04",deck:"d06",tag:"예상",q:"You discover a medication error or near miss.",ko:"투약 오류 · near miss",a:"I would keep the patient safe and tell the RN immediately. I would report facts and follow documentation and incident procedures.",key:"환자 우선 · 즉시 보고 · 사실"},{id:"06.05",deck:"d06",tag:"예상",q:"How do you prioritise several patients or call bells?",ko:"우선순위",a:"I would prioritise patients based on their clinical condition and urgency.\nFirst, I would attend to patients with urgent needs, such as breathing difficulties, chest pain, falls or abnormal vital signs, and immediately inform the RN.\nNext, I would prioritise time-critical care, such as scheduled BGL checks and important observations.\nThen, I would assist with routine care, such as showering and toileting.\nIf several patients needed help at the same time, I would communicate with the RN, ask other team members for support and make sure no patient was left at risk.",key:"응급 → 시간 중요 → 일상 · 혼자 모두 해결하지 않기"},{id:"06.05a",deck:"d06",tag:"예상",q:"What is time-critical care?",ko:"시간이 중요한 간호의 의미",a:"Time-critical care is care that must happen at the right time to prevent harm or deterioration. Examples include scheduled BGL checks, urgent observations and time-sensitive medications, which I would promptly communicate to the RN rather than administer outside my USIN scope.",key:"정해진 시간 · BGL · 긴급 관찰 · 투약은 RN과 협력"},{id:"06.05b",deck:"d06",tag:"예상",q:"How would you manage time-critical care?",ko:"시간이 중요한 업무 관리",a:"I would review the care plan at the start of the shift and identify tasks that need to be completed on time. I would prioritise urgent observations and scheduled BGL checks within my scope and confirm medication-related tasks with the RN. If I could not finish on time, I would tell the RN early and seek help.",key:"계획 확인 → 시간별 우선순위 → RN 협력 → 지연 시 조기 보고"},{id:"06.05c",deck:"d06",tag:"예상",q:"What if two patients need care at the same time?",ko:"두 환자가 동시에 간호를 요구하면?",a:"I would identify which patient has the most urgent clinical need. For example, I would respond to a patient with low BGL before routine hygiene care, alert the RN and ask another team member to help the second patient. I would then follow up to ensure both patients received safe care.",key:"임상 위험 우선 · 저혈당 vs 일상 위생 · 팀 지원 · 재확인"},{id:"06.06",deck:"d06",tag:"예상",q:"How would you give an ISBAR handover?",ko:"ISBAR",a:"I would use ISBAR: identify, situation, background, assessment and recommendation. I would clearly explain what help is needed.",key:"Identify · Situation · Background · Assessment · Recommendation"},{id:"06.07",deck:"d06",tag:"예상",q:"What should go in your documentation?",ko:"기록",a:"I document care, observations, patient responses and escalation accurately and promptly. I never document care before doing it.",key:"관찰 · 행동 · 반응 · 보고 · 시간"},{id:"06.08",deck:"d06",tag:"예상",q:"How do you protect confidentiality?",ko:"비밀 유지",a:"I share information only with authorised people for care. I keep records secure and check consent before family updates.",key:"정보 접근 권한 · 기록 보안 · 가족 동의 확인"},{id:"06.09",deck:"d06",tag:"예상",q:"How do you prevent infection, and what are the five moments?",ko:"감염예방 · 손위생",a:"I follow the five moments of hand hygiene, wear appropriate PPE and clean shared equipment. Gloves never replace hand hygiene.",key:"환자 접촉 전 · 시술 전 · 체액 노출 후 · 환자 접촉 후 · 주변 접촉 후 · PPE · 장비 · 격리"},{id:"06.10",deck:"d06",tag:"예상",q:"How do you confirm the correct patient?",ko:"환자 확인",a:"I check three approved identifiers, such as name, date of birth and MRN, against the wristband and record before care.",key:"이름 · DOB · MRN · 침상번호 사용 금지"},{id:"06.11",deck:"d06",tag:"예상",q:"How do you provide culturally safe care?",ko:"문화적 안전",a:"I ask about the patient's preferences without making assumptions. I respect their choices and arrange interpreter support if needed.",key:"환자가 느끼는 안전 · 선택 · 성찰"},{id:"06.12",deck:"d06",tag:"예상",q:"What if the patient does not understand English?",ko:"언어 장벽",a:"I would ask the RN to arrange an accredited interpreter. I would speak to the patient directly and check understanding.",key:"통역 · 환자에게 직접 · 이해 확인"},{id:"07.01",deck:"d07",tag:"예상",q:"Tell us about yourself.",ko:"자기소개",a:"Hi, I'm Jinhee, a second-year nursing student at UniSC. I work as an AIN at Arcare Maroochydore and have aged care and hospital placement experience. I'm positive and organised, like to plan ahead, and enjoy working with people.",key:"이름·학년은 면접일 기준 확인 · ⚠ 근무지 Arcare/Regis 통일"},{id:"07.02",deck:"d07",tag:"예상",q:"Why do you want to work as a USIN here?",ko:"지원동기",a:"During my placement at SCUH, I had a great experience and learned a lot from the nursing team.\nI share the hospital's values, especially compassion, accountability and innovation.\nI enjoy caring for patients, take responsibility for my work and always try to learn and improve.\nI would love the opportunity to support the nursing team and provide safe, compassionate care to patients.",key:"기여 + 학습 + 안전 · Values: Integrity · Compassion · Accountability · Innovation"},{id:"07.03",deck:"d07",tag:"예상",q:"What does person-centred care mean to you?",ko:"환자 중심 간호",a:"Person-centred care means respecting each patient's needs, choices and dignity. I would listen to what matters to them, involve them in their care and support their independence.",key:"환자 목표 · 선택 · 존엄 · 참여"},{id:"07.04",deck:"d07",tag:"예상",q:"Do you have any questions for us?",ko:"마지막 질문",a:"I hope this opportunity will help me take the next step towards becoming a great nurse. Thank you.",key:"다음 단계 · great nurse · Thank you"},{id:"07.05",deck:"d07",tag:"예상",q:"You do not know the answer or have not had that experience.",ko:"모르는 질문 대응",a:"I haven't faced that situation, but I would focus on safety, stay within my scope and ask the RN for help.",key:"모르는 경험 지어내지 않기"},{id:"07.06",deck:"d07",tag:"예상",q:"How is aged care experience relevant to hospital work?",ko:"요양원 경험의 병원 적용",a:"Aged care taught me personal care, communication and how to notice changes. These skills help me support hospital patients.",key:"관찰 · 존엄 · 의사소통 → 병원 적용"},{id:"07.07",deck:"d07",tag:"예상",q:"Which clinical skills can you bring to this role?",ko:"가능한 임상 술기",a:"I can help with personal care, observations and reporting changes. I would check local approval and competency for each USIN task.",key:"실습 가능 ≠ USIN 자동 허용"},{id:"07.08",deck:"d07",tag:"예상",q:"What are your strengths and an area you need to improve?",ko:"강점 · 보완할 점",a:"One of my strengths is that I'm a quick learner. I ask questions, learn new routines quickly, and always try to improve through feedback.\nOne of my weaknesses is that I sometimes worry too much when starting something new. To improve this, I prepare in advance and ask questions when I'm unsure. Once I understand the routine, I become more confident.",key:"약점 + 구체적 개선 + 확인"},{id:"02.10",deck:"d07",tag:"후기 기출",q:"What are your strengths, and why should we choose you?",ko:"장점 · 채용 이유",a:"I have aged care and hospital placement experience. I'm reliable, report concerns early and work safely within my scope.",key:"경험 · 태도 · 보고 · 성장"},{id:"02.12",deck:"d07",tag:"후기 기출",q:"What is your study stage, availability and earliest start date?",ko:"학업 현황 · 근무 가능일 · 시작일",a:"I'm a second-year UniSC nursing student on placement. I would confirm my availability around study, placements and visa limits.",key:"실제 요일·시작일 준비 · 실습·여행 일정 확인"},{id:"08.01",deck:"d08",tag:"예상",q:"What exactly was your role, rather than the team's role?",ko:"너는 구체적으로 뭘 했나?",a:"I provide assigned care, observe changes and report them to the RN. I follow directions and take responsibility for my own actions.",key:"내 역할 · 관찰 · 보고 · 업무범위"},{id:"08.02",deck:"d08",tag:"예상",q:"Why was that action important?",ko:"왜 중요했나?",a:"Early reporting helps the RN act quickly. Following the care plan also keeps patients safe.",key:"조기 보고 · 의사결정 지원 · 일관성"},{id:"08.03",deck:"d08",tag:"예상",q:"How did you know the care was effective?",ko:"효과를 어떻게 확인했나?",a:"I would recheck symptoms and observations within my scope. I would report whether the patient improved and escalate ongoing concerns.",key:"재평가 → 기록 → 공유"},{id:"09.01",deck:"d09",tag:"Nambour 기출",q:"How would you escalate to the RN if a patient's vital signs were out of range?",ko:"활력징후 · 이상 소견",a:"I would confirm identity, explain the check and measure observations correctly. I would compare results with previous readings and report concerns to the RN.",key:"T·P·BP · 추세·기준치 · RN 보고 · 재측정"},{id:"09.02",deck:"d09",tag:"예상",q:"What is your role when taking an ECG?",ko:"ECG 시행 시 역할",a:"If authorised, I would confirm identity, explain the ECG, protect privacy and place electrodes correctly. I would give the recording to the RN.",key:"환자 확인 · 전극 위치 · privacy · 기록 전달"},{id:"09.03",deck:"d09",tag:"예상",q:"How would you perform a blood glucose reading and report it?",ko:"BGL 측정 · 보고",a:"I would check identity, follow the BGL procedure and record the result. I would urgently report low or unexpected readings to the RN.",key:"측정 준비 · 감염예방 · 수치·시간 · 저혈당 RN 즉시 보고"},{id:"09.04",deck:"d09",tag:"예상",q:"What wound care can a USIN provide?",ko:"상처 간호 범위",a:"I would follow the wound plan and use infection control precautions. I would report redness, bleeding, discharge or increased pain.",key:"가능 업무 범위 확인 · 무균술 · 감염 징후 보고"},{id:"09.05",deck:"d09",tag:"예상",q:"How would you support showering, dressing and eating while protecting dignity?",ko:"개인위생 · 옷 · 식사 · 존엄",a:"I would explain care, gain consent and protect privacy. For meals, I would check the diet and swallowing plan and report any difficulty.",key:"동의 · privacy · 독립성 · 연하 확인"},{id:"09.06",deck:"d09",tag:"예상",q:"How would you safely help a patient move around?",ko:"이동 보조",a:"I would check the mobility and weight-bearing plan and use the right help and equipment. I would stop and report dizziness or breathlessness.",key:"mobility plan · 보조기구 · 인원 · 악화 시 중단"},{id:"09.07",deck:"d09",tag:"예상",q:"What would you do at the start of a USIN shift, and what must you escalate?",ko:"근무 시작 · 보고",a:"I would check assigned patients and tasks with my RN at the start of the shift. I would follow care plans, work within my scope and report any changes.",key:"RN 체크인 → 계획 확인 → scope 안에서 수행 → 변화 보고"},{id:"10.01",deck:"d10",tag:"예상",q:"What if the team disagrees about the plan?",ko:"팀 내 의견이 다르면?",a:"I would share my observations respectfully and ask the RN to clarify the plan. I would escalate any remaining safety risk.",key:"의견 존중 · 합의 확인 · 안전 발언"},{id:"10.02",deck:"d10",tag:"예상",q:"What if the colleague is senior or dismisses your concern?",ko:"상급자가 무시하면?",a:"I would clearly explain the changes and my concerns. If not addressed, I would escalate to the nurse in charge or emergency team.",key:"서열보다 안전 · 계속 escalate"},{id:"10.03",deck:"d10",tag:"예상",q:"What if you see unsafe practice?",ko:"위험한 업무를 목격하면?",a:"I would act safely to prevent harm and tell the RN. I would report only what I saw and follow incident procedures.",key:"보호 → 보고 → 사실 기록"},{id:"10.04",deck:"d10",tag:"예상",q:"How do you respond to feedback or bullying?",ko:"피드백 · 괴롭힘",a:"I would listen to feedback and improve my practice. I would report bullying or discrimination through the right process.",key:"피드백 수용 · 괴롭힘은 별도 보고"},{id:"10.05",deck:"d10",tag:"예상",q:"Give a real example of managing a difficult situation.",ko:"어려웠던 실제 경험",a:"During my hospital placement, I was assigned three patients.\nI spent too much time reviewing their care plans and medication charts before starting my shift.\nAs a result, I felt rushed when it was time to check vital signs and assist with the medication round.\nI realised that I needed to improve my time management.\nThis experience taught me that good time management and communication are important for patient safety. Next time, I would plan my tasks more efficiently and ask the RN for help before I fall behind.",key:"shift planner · 우선순위 · 지원 요청 · ⚠ 원본 KEY는 '2명 환자' — 답변은 three, 하나로 통일"},{id:"10.06",deck:"d10",tag:"예상",q:"What would you do differently next time?",ko:"다시 한다면?",a:"I would plan priorities, ask for help early and confirm handover details. I would use feedback to improve next shift.",key:"구체적 1가지 · 성찰 · 적용"},{id:"10.07",deck:"d10",tag:"예상",q:"How would you check whether a task is within your USIN scope?",ko:"업무 범위 확인 방법",a:"I would check the position description, local policy and my competency. I would confirm RN delegation and never do unauthorised tasks.",key:"직무기술서 → 정책 → 평가된 역량 → RN 위임/감독"},{id:"P1",deck:"phr",tag:"표현",q:"면접 시작 인사",ko:"Opening",a:"First of all, thank you for considering me for this position. I really appreciate the opportunity to be here today.",key:""},{id:"P2",deck:"phr",tag:"표현",q:"면접 마지막에 할 말",ko:"Closing",a:"If I'm given the opportunity to work here as a USIN, I'd love to keep learning, support the nurses and provide good care to patients. Thank you again for your time and consideration.",key:""},{id:"P3",deck:"phr",tag:"표현",q:"환자 2명을 배정받아 간호를 제공했습니다.",ko:"환자 2명 담당 경험",a:"I was assigned two patients and provided care for them.",key:""}]})</script><script>window.PACKS.push({id:"ain",name:"AIN 질문팩",desc:"Assistant in Nursing 면접 · 라포, 일상 간호, 역할 범위",decks:[{id:"a",name:"기출",short:"기출"},{id:"b",name:"라포·소통",short:"소통"},{id:"d",name:"일상 간호",short:"간호"},{id:"e",name:"역할·안전",short:"안전"},{id:"f",name:"지원·경험",short:"경험"}],cards:[{id:"A01",deck:"a",tag:"AIN 기출",q:"How would you build rapport with a patient?",ko:"환자와 라포 형성",a:"I would introduce myself, use the patient's preferred name and check their care notes to understand their preferences.\nWhile providing care, I would listen to their stories and ask about their family, pets or hobbies.\nI would explain care and offer choices to help them feel comfortable and build trust.",key:"소개 · 경청 · 선택 · 신뢰"},{id:"A02",deck:"a",tag:"AIN 기출",q:"How would you introduce yourself to a patient?",ko:"환자에게 자기소개",a:"Hi, my name is Jinny. I'm a personal carer, and I'm looking after you during this shift. It's nice to meet you!\nIs there anything you need right now? If you need anything later, please feel free to press the call bell.",key:"이름 · 역할 · 설명 · 환자 확인"},{id:"B01",deck:"b",tag:"AIN 예상",q:"What if the patient does not trust you?",ko:"신뢰하지 않는 환자",a:"I would listen to their concerns, explain my role and offer choices. I would give them time and ask the RN for support if needed.",key:"강요하지 않기 · 시간 · 선택"},{id:"B08",deck:"b",tag:"AIN 예상",q:"What if a family member is upset about the care?",ko:"화난 보호자",a:"I would listen calmly and acknowledge their concern. I would involve the RN for clinical questions or unresolved issues.",key:"경청 · 인정 · 역할 범위 · RN"},{id:"D04",deck:"d",tag:"AIN 예상",q:"A patient needs two-person assistance but you are alone.",ko:"2인 보조가 필요한데 혼자라면?",a:"I would call for a second staff member and keep the patient safe. I would never attempt a two-person transfer alone.",key:"혼자 이동 금지 · 도움 요청 · 안전 설명"},{id:"D09",deck:"d",tag:"AIN 예상",q:"How would you support continence and toileting?",ko:"배뇨 · 배변 · 화장실 지원",a:"I would follow the toileting plan, provide privacy and help with safe access. I would report changes in urine or bowel habits.",key:"개별 계획 · 낙상 예방 · 피부 · 변화 보고"},{id:"E03",deck:"e",tag:"AIN 예상",q:"Can you give medication or perform clinical procedures as an AIN?",ko:"투약 · 임상 술기",a:"I would check policy, my competency and RN supervision first. If the task is not authorised, I would refer it to the RN.",key:"정책 · 역량 · 감독"},{id:"E09",deck:"e",tag:"AIN 예상",q:"What if you suspect abuse or neglect?",ko:"학대 · 방임 의심",a:"I would protect the patient and report the concern promptly. I would record facts and the patient's words, not investigate it myself.",key:"안전 · 보호 절차 · 객관적 기록 (직접 조사 X, 관찰 사실·환자 말 그대로 기록)"},{id:"F03",deck:"f",tag:"AIN 예상",q:"Why do you want this hospital AIN role?",ko:"병원 AIN 지원동기",a:"I enjoy caring for people and helping them feel comfortable. It feels really rewarding to see patients happy, even when I'm just providing basic care.\nI want to use my aged care experience in a hospital setting and continue learning from the nursing team.",key:"경험 적용 · 병원 관심 · 팀 기여"},{id:"F07",deck:"f",tag:"AIN 예상",q:"Tell us about a mistake or near miss and what you learned.",ko:"실수 · near miss 경험",a:"During my first aged care placement, I was asked to add thickener to a resident's drink. I was about to do it, but a facilitator stopped me and explained that I needed to check my scope first.\nSince then, I've learned to always check my scope of practice and ask the RN when I'm unsure.",key:"실행 전 중단 · 범위 · 연하 계획"}]})</script><script>window.PACKS.push({id:"med",name:"Medication 팩",desc:"수술 병동 약 · Class, Indication, 작용, 부작용",decks:[{id:"pain",name:"Analgesia · 진통제",short:"진통제"},{id:"opioid",name:"Opioids & Reversal · 오피오이드",short:"오피오이드"},{id:"nausea",name:"Antiemetics · Post-operative nausea and vomiting (PONV)",short:"구역·구토"},{id:"vte",name:"VTE & Bleeding · 항응고 · 출혈",short:"항응고"},{id:"abx",name:"Antibiotics · 항생제",short:"항생제"},{id:"gi",name:"GI & Bowels · 위장 · 변비",short:"위장"},{id:"fluid",name:"Fluids & BGL · 수액 · 혈당",short:"수액·혈당"},{id:"cardio",name:"Cardiac & Lipids · 심장 · 콜레스테롤",short:"심장"},{id:"other",name:"Other ward meds · 호흡 · 수면 · 빈혈",short:"기타"}],cards:[{id:"M01",deck:"pain",tag:"병동 필수",q:"Paracetamol",ko:"Panadol",a:"## Class\nSimple analgesic / antipyretic\n## Indication\nPost-operative pain 기본 진통제 — multimodal analgesia 1단계 + antipyretic. Opioid requirement ↓\n## Mechanism\nCentral (CNS)에서 prostaglandin synthesis ↓ → pain ↓, hypothalamus에 작용 → fever ↓\n## Side effects\n• Normal dose → side effects rare\n• Overdose → hepatotoxicity (liver damage)\n• Max 4 g/day (adult) — low body weight / liver disease → lower",key:""},{id:"M02",deck:"pain",tag:"병동 필수",q:"Ibuprofen / Celecoxib / Parecoxib (IV)",ko:"Nurofen / Celebrex / Dynastat",a:"## Class\nNon-steroidal anti-inflammatory drug (NSAID) — COX inhibitor\n접미사: -coxib (celecoxib, parecoxib)\n## Indication\nInflammation + pain ↓ — 특히 orthopaedic surgery 후. Parecoxib = intravenous (IV), nil by mouth (NBM)일 때\n## Mechanism\ncyclo-oxygenase (COX) enzyme block → prostaglandin ↓ → inflammation · pain · fever ↓. Celecoxib/Parecoxib = COX-2 selective → gastrointestinal (GI) side effects 적음\n## Side effects\n• gastrointestinal (GI) bleeding / peptic ulcer\n• acute kidney injury (AKI) (renal blood flow ↓)\n• blood pressure (BP) ↑, fluid retention\n• Bleeding risk ↑ (ibuprofen)",key:""},{id:"M03",deck:"pain",tag:"Analgesia",q:"Pregabalin",ko:"Lyrica",a:"## Class\nGabapentinoid (adjuvant)\n## Indication\nNeuropathic pain, multimodal analgesia의 adjuvant → opioid-sparing\n## Mechanism\nCalcium channel (α2δ subunit)에 결합 → excitatory neurotransmitter release ↓ → overactive nerves 진정\n## Side effects\n• Dizziness, drowsiness → falls risk\n• + Opioids → sedation · respiratory depression ↑\n• Peripheral oedema, blurred vision",key:""},{id:"M04",deck:"pain",tag:"Analgesia",q:"Ropivacaine",ko:"Naropin",a:"## Class\nLocal anaesthetic (amide)\n접미사: -caine\n## Indication\nNerve blocks (for example femoral, adductor canal for knee), epidural, wound infusion catheter → opioid-sparing analgesia\n## Mechanism\nNerve의 voltage-gated sodium (Na⁺) channels block → nerve conduction 차단 → 그 부위 pain signal 안 감\n## Side effects\n• local anaesthetic systemic toxicity (LAST): perioral numbness, metallic taste, tinnitus → seizures, arrhythmias\n• Epidural → hypotension\n• Motor block → leg weakness → falls",key:""},{id:"M05",deck:"opioid",tag:"병동 필수",q:"Oxycodone — immediate-release (IR)",ko:"Endone",a:"## Class\nOpioid — mu agonist\n접미사: —\n## Indication\nModerate–severe post-operative pain, 특히 as needed (PRN) breakthrough pain\n## Mechanism\nBrain · spinal cord의 mu opioid receptor 자극 → pain signal transmission ↓, pain perception ↓\n## Side effects\n• Respiratory depression (most dangerous)\n• Sedation, dizziness → falls\n• Constipation (almost always), nausea & vomiting\n• Urinary retention, pruritus, hypotension",key:""},{id:"M06",deck:"opioid",tag:"병동 필수",q:"Oxycodone + Naloxone — controlled-release (CR)",ko:"Targin",a:"## Class\nControlled-release opioid\n접미사: —\n## Indication\nOngoing post-operative pain — 12-hourly baseline analgesia. Breakthrough → Endone as needed (PRN)\n## Mechanism\nOxycodone = pain relief. Naloxone = oral로 먹으면 gut에서만 작용 (low bioavailability) → gut opioid receptor block → constipation ↓\n## Side effects\n• Same as oxycodone: respiratory depression, sedation, nausea\n• Constipation — less, but still possible",key:""},{id:"M07",deck:"opioid",tag:"Opioids & Reversal",q:"Tapentadol — immediate-release (IR) / sustained-release (SR)",ko:"Palexia",a:"## Class\nOpioid + noradrenaline reuptake inhibitor\n## Indication\nModerate–severe pain + neuropathic pain에도 효과\n## Mechanism\nMu receptor agonist + noradrenaline reuptake inhibition (descending pain pathway 강화) → dual action\n## Side effects\n• Nausea, dizziness, drowsiness, constipation (gastrointestinal side effects < oxycodone)\n• Respiratory depression\n• Seizures, + selective serotonin reuptake inhibitor (SSRI) → serotonin syndrome",key:""},{id:"M08",deck:"opioid",tag:"Opioids & Reversal",q:"Tramadol",ko:"Tramal",a:"## Class\nWeak opioid + serotonin-noradrenaline reuptake inhibitor (SNRI)\n## Indication\nMild–moderate pain, strong opioid 전 단계\n## Mechanism\nWeak mu agonist + serotonin · noradrenaline reuptake inhibition\n## Side effects\n• Nausea, dizziness, sweating\n• Seizure threshold ↓ (epilepsy 주의)\n• + Antidepressants → serotonin syndrome\n• Elderly → confusion",key:""},{id:"M09",deck:"opioid",tag:"병동 필수",q:"Naloxone",ko:"Narcan",a:"## Class\nOpioid antagonist (reversal)\n접미사: —\n## Indication\nOpioid overdose → respiratory depression / over-sedation reversal (hospital criteria: high sedation score or low respiratory rate (RR))\n## Mechanism\nOpioid receptor에 대신 결합 (competitive antagonist) → opioid 밀어냄 → breathing · consciousness 회복\n## Side effects\n• Sudden return of pain\n• Withdrawal: agitation, nausea, tachycardia, hypertension\n• Shorter half-life than most opioids → re-sedation",key:""},{id:"M10",deck:"opioid",tag:"Opioids & Reversal",q:"Morphine",ko:"PCA / MS Contin",a:"## Class\nOpioid — mu agonist\n접미사: —\n## Indication\nSevere post-operative pain — patient-controlled analgesia (PCA), intravenous (IV) / subcutaneous (SC) / oral. Big abdominal surgery 후 많이 씀\n## Mechanism\nMu opioid receptor 자극 → pain transmission ↓. Liver에서 대사 → active metabolites는 kidney로 배설\n## Side effects\n• Respiratory depression, sedation\n• Nausea / vomiting, pruritus\n• Constipation, urinary retention\n• Hypotension\n• Renal impairment → metabolites 축적 → toxicity",key:""},{id:"M11",deck:"opioid",tag:"Opioids & Reversal",q:"Fentanyl",ko:"Sublimaze / Durogesic",a:"## Class\nSynthetic opioid — potent mu agonist\n접미사: —\n## Indication\nSevere pain — patient-controlled analgesia (PCA) (esp. renal impairment), intra-operative / recovery intravenous (IV), patches = chronic pain only\n## Mechanism\nMu receptor agonist — ~100× morphine potency, lipid soluble → fast onset, short duration (IV). No active metabolites → renal impairment에 선호\n## Side effects\n• Respiratory depression (rapid, potent)\n• Sedation, nausea\n• Rapid high-dose intravenous (IV) → chest wall rigidity",key:""},{id:"M12",deck:"nausea",tag:"병동 필수",q:"Ondansetron",ko:"Zofran",a:"## Class\nSerotonin 5-HT3 receptor antagonist (5-HT3 antagonist)\n접미사: —\n## Indication\npost-operative nausea and vomiting (PONV), opioid-induced nausea\n## Mechanism\nGut + brain (chemoreceptor trigger zone (CTZ) / vomiting centre)의 serotonin (5-HT3) receptor block → vomiting signal ↓\n## Side effects\n• Headache\n• Constipation (+ opioids → worse)\n• QT prolongation",key:""},{id:"M13",deck:"nausea",tag:"병동 필수",q:"Metoclopramide",ko:"Maxolon",a:"## Class\nDopamine (D2) antagonist + prokinetic\n접미사: —\n## Indication\nNausea & vomiting, gastric emptying 촉진 필요할 때\n## Mechanism\nchemoreceptor trigger zone (CTZ)의 dopamine (D2) receptor block + prokinetic (gastrointestinal (GI) motility ↑)\n## Side effects\n• Extrapyramidal side effects (EPS): dystonia, rigidity (young women, elderly ↑)\n• Drowsiness, restlessness",key:""},{id:"M14",deck:"nausea",tag:"Antiemetics",q:"Prochlorperazine",ko:"Stemetil",a:"## Class\nPhenothiazine (D2 antagonist)\n## Indication\nNausea & vomiting, vertigo — 보통 second line\n## Mechanism\nchemoreceptor trigger zone (CTZ)의 dopamine (D2) receptor block\n## Side effects\n• Sedation, hypotension (esp. intravenous (IV)/IM)\n• extrapyramidal side effects (EPS)",key:""},{id:"M15",deck:"nausea",tag:"Antiemetics",q:"Dexamethasone",ko:"Dexamethasone",a:"## Class\nCorticosteroid\n접미사: -asone / -sone\n## Indication\npost-operative nausea and vomiting (PONV) prophylaxis, swelling · inflammation ↓\n## Mechanism\nPotent anti-inflammatory (inflammatory mediators ↓). post-operative nausea and vomiting (PONV) mechanism → not fully understood\n## Side effects\n• Hyperglycaemia (esp. diabetics)\n• Infection risk ↑, delayed wound healing\n• Fast intravenous (IV) push → perineal burning / itch",key:""},{id:"M16",deck:"vte",tag:"병동 필수",q:"Enoxaparin",ko:"Clexane",a:"## Class\nLow molecular weight heparin (LMWH)\n접미사: -parin\n## Indication\nPost-operative deep vein thrombosis (DVT) / pulmonary embolism (PE) prophylaxis — surgery + reduced mobility → venous thromboembolism (VTE) risk ↑. (Treatment dose → DVT/PE 치료)\n## Mechanism\nAntithrombin 강화 → factor Xa inhibition → clotting cascade 차단 → clot formation ↓\n## Side effects\n• Bleeding, bruising (injection site)\n• heparin-induced thrombocytopenia (HIT) → platelets ↓\n• Hyperkalaemia (rare)",key:""},{id:"M17",deck:"vte",tag:"병동 필수",q:"Heparin — unfractionated, subcutaneous (SC) / intravenous (IV)",ko:"Heparin",a:"## Class\nAnticoagulant\n접미사: -parin\n## Indication\ndeep vein thrombosis (DVT) prophylaxis — 특히 renal impairment로 Clexane 어려울 때. intravenous (IV) infusion = treatment\n## Mechanism\nAntithrombin 강화 → thrombin (IIa) + factor Xa 둘 다 inhibit\n## Side effects\n• Bleeding\n• heparin-induced thrombocytopenia (HIT) (more common than Clexane)",key:""},{id:"M18",deck:"vte",tag:"병동 필수",q:"Rivaroxaban / Apixaban",ko:"Xarelto / Eliquis",a:"## Class\nDirect oral anticoagulant (DOAC) — factor Xa inhibitor\n접미사: -xaban\n## Indication\nvenous thromboembolism (VTE) prophylaxis after hip / knee replacement (oral), atrial fibrillation (AF), deep vein thrombosis (DVT) treatment\n## Mechanism\nFactor Xa 직접 block → thrombin generation ↓ → clot ↓\n## Side effects\n• Bleeding\n• Anaemia",key:""},{id:"M19",deck:"vte",tag:"VTE & Bleeding",q:"Tranexamic acid (TXA)",ko:"Cyklokapron",a:"## Class\nAntifibrinolytic\n## Indication\nIntra-operative / post-operative blood loss ↓ (esp. joint replacement)\n## Mechanism\nPlasminogen → plasmin 전환 block → 만들어진 clot breakdown (fibrinolysis) ↓ → bleeding ↓. (Anticoagulant 반대 개념)\n## Side effects\n• Nausea, diarrhoea\n• Theoretical thrombosis risk ↑\n• High dose → seizures",key:""},{id:"M20",deck:"abx",tag:"병동 필수",q:"Cefazolin (IV) / Cephalexin (PO)",ko:"Kefzol / Keflex",a:"## Class\n1st-gen cephalosporin\n접미사: cef- / ceph-\n## Indication\nSurgical prophylaxis — skin flora (Staph, Strep). Wound infection 치료\n## Mechanism\nBacterial cell wall synthesis 방해 → bacteria lysis (bactericidal)\n## Side effects\n• Allergy (rash → anaphylaxis)\n• Diarrhoea, C. difficile\n• Phlebitis (IV site)",key:""},{id:"M21",deck:"abx",tag:"Antibiotics",q:"Metronidazole",ko:"Flagyl",a:"## Class\nNitroimidazole\n접미사: -azole\n## Indication\nAnaerobic bacteria — bowel surgery, intra-abdominal infection, appendicitis, C. diff\n## Mechanism\nBacteria 안에서 DNA damage → bacterial death\n## Side effects\n• Metallic taste, nausea\n• + Alcohol → disulfiram-like reaction (severe nausea and vomiting, flushing)\n• Long-term → peripheral neuropathy",key:""},{id:"M22",deck:"abx",tag:"Antibiotics",q:"Piperacillin + Tazobactam",ko:"Tazocin",a:"## Class\nBroad-spectrum penicillin + β-lactamase inhibitor\n접미사: -cillin\n## Indication\nSevere infection — intra-abdominal sepsis, hospital-acquired infection, post-operative fever\n## Mechanism\nPiperacillin → cell wall synthesis 방해. Tazobactam → β-lactamase (resistance enzyme) block → piperacillin 보호\n## Side effects\n• Penicillin allergy → contraindicated\n• Diarrhoea, C. diff\n• Hypokalaemia, platelet abnormalities",key:""},{id:"M23",deck:"abx",tag:"병동 필수",q:"Amoxicillin (± clavulanate)",ko:"Amoxil / Augmentin",a:"## Class\nAminopenicillin\n접미사: -cillin\n## Indication\nRespiratory infection — community-acquired pneumonia (CAP), sinusitis, urinary tract infection (UTI), ear/throat infection, H. pylori. Augmentin = + clavulanate → broader cover\n## Mechanism\nPenicillin-binding proteins에 결합 → bacterial cell wall synthesis 방해 → bactericidal. Clavulanate = β-lactamase inhibitor\n## Side effects\n• Allergy — rash → anaphylaxis\n• Diarrhoea, nausea, C. difficile\n• Oral thrush",key:""},{id:"M24",deck:"abx",tag:"병동 필수",q:"Flucloxacillin",ko:"Flucil / Staphylex",a:"## Class\nNarrow-spectrum, penicillinase-resistant penicillin\n접미사: -cillin\n## Indication\nmethicillin-sensitive Staphylococcus aureus (MSSA) 감염 — cellulitis, wound infection, surgical site infection, osteomyelitis\n## Mechanism\nCell wall synthesis 방해. Staph이 만드는 penicillinase에 분해되지 않음 → Staph에 효과\n## Side effects\n• Allergy (penicillin)\n• Diarrhoea, nausea\n• Cholestatic hepatitis / jaundice (esp. elderly, long course)\n• intravenous (IV) → phlebitis",key:""},{id:"M25",deck:"abx",tag:"Antibiotics",q:"Ceftriaxone",ko:"Rocephin",a:"## Class\n3rd-gen cephalosporin\n접미사: cef- / ceph-\n## Indication\nIntra-abdominal infection (+ metronidazole), community-acquired pneumonia (CAP), urinary tract infection (UTI) / urosepsis, meningitis — once daily intravenous (IV)\n## Mechanism\nCell wall synthesis 방해 → bactericidal. 1st gen보다 gram-negative cover ↑\n## Side effects\n• Allergy (penicillin cross-reactivity — low)\n• Diarrhoea, C. diff\n• Biliary sludge (rare)",key:""},{id:"M26",deck:"abx",tag:"Antibiotics",q:"Gentamicin",ko:"Gentamicin",a:"## Class\nAminoglycoside\n접미사: -mycin (aminoglycoside)\n## Indication\nGram-negative sepsis, urosepsis, urology surgical prophylaxis — usually short course (≤ 48–72 h empirical)\n## Mechanism\nBacterial ribosome (30S)에 결합 → protein synthesis 방해 → bactericidal\n## Side effects\n• Nephrotoxicity (AKI)\n• Ototoxicity — hearing loss, tinnitus, balance problems (can be permanent)",key:""},{id:"M27",deck:"gi",tag:"병동 필수",q:"Pantoprazole",ko:"Somac",a:"## Class\nProton pump inhibitor (PPI)\n접미사: -prazole\n## Indication\nStress ulcer prophylaxis, gastrointestinal (GI) protection with non-steroidal anti-inflammatory drugs (NSAIDs) / steroids, gastro-oesophageal reflux disease (GORD)\n## Mechanism\nParietal cell의 proton pump (H⁺/K⁺ ATPase) block → gastric acid secretion ↓\n## Side effects\n• Headache, diarrhoea\n• Long-term: hypomagnesaemia, C. diff, fracture risk",key:""},{id:"M28",deck:"gi",tag:"병동 필수",q:"Docusate + Sennosides",ko:"Coloxyl with Senna",a:"## Class\nStool softener + stimulant laxative\n## Indication\nOpioid-induced constipation prevention — opioids 쓰면 거의 같이 charted\n## Mechanism\nDocusate → stool softener (water into stool). Senna → stimulant → peristalsis ↑\n## Side effects\n• Abdominal cramps\n• Diarrhoea",key:""},{id:"M29",deck:"gi",tag:"GI & Bowels",q:"Macrogol / Lactulose",ko:"Movicol / Lactulose",a:"## Class\nOsmotic laxative\n접미사: macrogol / lact-\n## Indication\nConstipation — Coloxyl/Senna로 부족할 때\n## Mechanism\nOsmotic effect → bowel 안으로 water 끌어당김 → softer, bulkier stool\n## Side effects\n• Bloating, flatulence (esp. lactulose)\n• Diarrhoea → dehydration / electrolyte imbalance",key:""},{id:"M30",deck:"fluid",tag:"병동 필수",q:"Compound sodium lactate / balanced crystalloid",ko:"Hartmann’s / Plasma-Lyte",a:"## Class\nIsotonic crystalloid IV fluid\n## Indication\nnil by mouth (NBM) 중 maintenance fluids, intra-operative fluid loss replacement, hypotension / dehydration 교정\n## Mechanism\nIsotonic (plasma와 비슷) → intravascular / extracellular volume 보충. Na, K, Ca, lactate (→ liver에서 bicarbonate)\n## Side effects\n• Fluid overload: shortness of breath (SOB), crackles, oedema\n• Electrolyte imbalance",key:""},{id:"M31",deck:"fluid",tag:"Fluids & BGL",q:"Insulin aspart",ko:"NovoRapid",a:"## Class\nRapid-acting insulin\n접미사: insulin\n## Indication\nDiabetic patients mealtime blood glucose level (BGL) control, surgery stress / steroids로 ↑된 BGL → correction scale\n## Mechanism\nCells의 glucose uptake ↑ → blood glucose level (BGL) ↓. Onset ~15 min (very fast)\n## Side effects\n• Hypoglycaemia (shaky, sweaty, confused)\n• Hypokalaemia",key:""},{id:"M32",deck:"fluid",tag:"Fluids & BGL",q:"Potassium chloride",ko:"KCl (IV) / Slow-K / Chlorvescent",a:"## Class\nElectrolyte replacement — HIGH ALERT\n접미사: —\n## Indication\nHypokalaemia — post-operative, diuretics, vomiting, nasogastric (NG) losses, diarrhoea\n## Mechanism\npotassium (K⁺) 보충 → cardiac · muscle cell membrane potential 정상화 (K⁺ 낮으면 arrhythmia, weakness, ileus)\n## Side effects\n• intravenous (IV) too fast / too much → hyperkalaemia → cardiac arrest\n• IV → phlebitis, pain\n• Oral → gastrointestinal (GI) irritation",key:""},{id:"M33",deck:"fluid",tag:"Fluids & BGL",q:"Metformin",ko:"Diabex / Diaformin",a:"## Class\nBiguanide\n접미사: —\n## Indication\nType 2 diabetes 1st line — 수술 환자의 흔한 regular med\n## Mechanism\nLiver glucose production ↓ + insulin sensitivity ↑ → blood glucose level (BGL) ↓ (단독으로는 hypo 거의 X)\n## Side effects\n• gastrointestinal (GI) upset — nausea, diarrhoea\n• Lactic acidosis (rare) — renal impairment, dehydration, sepsis\n• Long-term → B12 deficiency",key:""},{id:"M34",deck:"cardio",tag:"병동 필수",q:"Aspirin (low dose)",ko:"Cartia / Astrix",a:"## Class\nAntiplatelet — cyclo-oxygenase-1 (COX-1) inhibitor\n접미사: —\n## Indication\nSecondary prevention of myocardial infarction (MI) / stroke, after cardiac stent, ischaemic heart disease (IHD) / atrial fibrillation (AF) history. (일부 병원은 joint replacement 후 venous thromboembolism (VTE) prophylaxis로도)\n## Mechanism\nPlatelet의 cyclo-oxygenase (COX)-1을 irreversibly block → thromboxane A2 ↓ → platelet aggregation ↓. Effect lasts platelet lifespan (~7–10 days)\n## Side effects\n• Bleeding, bruising\n• gastrointestinal (GI) irritation / GI bleeding\n• Bronchospasm in aspirin-sensitive asthma\n• High dose → tinnitus",key:""},{id:"M35",deck:"cardio",tag:"병동 필수",q:"Atorvastatin",ko:"Lipitor",a:"## Class\nHMG-CoA reductase inhibitor (statin)\n접미사: -statin\n## Indication\nHigh cholesterol (LDL) 조절, cardiovascular risk ↓ (prevents heart attack and stroke)\n## Mechanism\nLiver의 HMG-CoA reductase block → cholesterol synthesis ↓ → low-density lipoprotein (LDL) ↓ + plaque stabilisation\n## Side effects\n• Myalgia (muscle aches)\n• Rhabdomyolysis (rare, serious)\n• liver function tests (LFTs) ↑\n• gastrointestinal (GI) upset, headache",key:""},{id:"M36",deck:"cardio",tag:"Cardiac & Lipids",q:"Ezetimibe",ko:"Ezetrol",a:"## Class\nCholesterol absorption inhibitor\n접미사: —\n## Indication\nHigh cholesterol — statin만으로 부족할 때 add-on, or statin intolerance\n## Mechanism\nSmall intestine에서 cholesterol absorption block (NPC1L1) → low-density lipoprotein (LDL) ↓. (Statin = liver에서 합성 ↓, Ezetimibe = gut에서 흡수 ↓)\n## Side effects\n• gastrointestinal (GI) upset, diarrhoea\n• Myalgia (esp. with statin)\n• liver function tests (LFTs) ↑ (with statin)",key:""},{id:"M37",deck:"cardio",tag:"병동 필수",q:"Irbesartan",ko:"Avapro",a:"## Class\nAngiotensin II receptor blocker (ARB)\n접미사: -sartan\n## Indication\nHypertension, diabetic nephropathy (renal protection), heart failure\n## Mechanism\nAngiotensin II (AT1) receptor block → vasodilation + aldosterone ↓ (Na/water retention ↓) → blood pressure (BP) ↓\n## Side effects\n• Hypotension, dizziness → falls\n• Hyperkalaemia\n• acute kidney injury (AKI) (esp. dehydrated, + NSAIDs)\n• Cough — angiotensin-converting enzyme (ACE) inhibitor보다 훨씬 적음",key:""},{id:"M38",deck:"cardio",tag:"Cardiac & Lipids",q:"Frusemide (Furosemide)",ko:"Lasix",a:"## Class\nLoop diuretic\n접미사: -semide\n## Indication\nFluid overload (post-operative 수액 과다), heart failure, oedema, pulmonary oedema\n## Mechanism\nLoop of Henle의 sodium (Na⁺)-potassium (K⁺)-2Cl⁻ cotransporter block → Na + water excretion ↑ → diuresis\n## Side effects\n• Hypokalaemia, hyponatraemia, hypomagnesaemia\n• Dehydration, hypotension, acute kidney injury (AKI)\n• Ototoxicity (fast high-dose IV)\n• Urgency → falls",key:""},{id:"M39",deck:"cardio",tag:"Cardiac & Lipids",q:"Metoprolol",ko:"Betaloc / Minax",a:"## Class\nBeta-1 selective beta blocker\n접미사: -olol\n## Indication\nHypertension, atrial fibrillation (AF) rate control, ischaemic heart disease (IHD) / angina, heart failure — 많은 수술 환자의 regular med\n## Mechanism\nHeart의 beta-1 receptor block → heart rate (HR) ↓, contractility ↓ → blood pressure (BP) ↓, myocardial O₂ demand ↓\n## Side effects\n• Bradycardia, hypotension\n• Dizziness, fatigue\n• Bronchospasm (asthma 주의)\n• Masks hypoglycaemia signs (tachycardia)",key:""},{id:"M40",deck:"other",tag:"병동 필수",q:"Salbutamol",ko:"Ventolin",a:"## Class\nShort-acting beta-2 agonist (SABA)\n접미사: -terol 계열 (이름은 예외)\n## Indication\nBronchospasm — asthma / chronic obstructive pulmonary disease (COPD) reliever, wheeze, shortness of breath (SOB). (Nebulised → hyperkalaemia 치료 보조로도)\n## Mechanism\nAirway의 beta-2 receptor 자극 → bronchial smooth muscle relaxation → bronchodilation. Onset within minutes\n## Side effects\n• Tremor, tachycardia, palpitations\n• Hypokalaemia — potassium (K⁺) shifts into cells\n• Anxiety, headache",key:""},{id:"M41",deck:"other",tag:"Other ward meds",q:"Oxazepam",ko:"Serepax",a:"## Class\nBenzodiazepine\n접미사: -pam\n## Indication\nAnxiety, insomnia, alcohol withdrawal — liver impairment이나 elderly에서 선호 (no active metabolites)\n## Mechanism\ngamma-aminobutyric acid (GABA)-A receptor에서 GABA effect ↑ → central nervous system (CNS) depression → calming, sedation\n## Side effects\n• Sedation, drowsiness → falls\n• + Opioids → respiratory depression ↑\n• Elderly → confusion / delirium\n• Dependence, withdrawal",key:""},{id:"M42",deck:"other",tag:"Other ward meds",q:"Epoetin (EPO) / Darbepoetin",ko:"Eprex / Aranesp",a:"## Class\nErythropoiesis-stimulating agent (ESA)\n접미사: -poetin\n## Indication\nAnaemia of chronic kidney disease (CKD) (renal patients), chemotherapy-related anaemia → transfusion 필요 ↓\n## Mechanism\nKidney에서 나오는 hormone erythropoietin을 대신함 → bone marrow 자극 → red blood cell (RBC) production ↑ → haemoglobin (Hb) ↑. (CKD → EPO 부족 → anaemia). Darbepoetin = longer-acting (less frequent dosing)\n## Side effects\n• Hypertension\n• Thrombosis (deep vein thrombosis, stroke) — esp. haemoglobin (Hb) too high\n• Headache, injection site pain\n• Pure red cell aplasia (rare)",key:""},{id:"M43",deck:"other",tag:"병동 필수",q:"Thiamine",ko:"Thiamine (Vitamin B1)",a:"## Class\nVitamin B1 supplement\n접미사: —\n## Indication\nAlcohol misuse, malnutrition, refeeding risk → Wernicke’s encephalopathy prevention / treatment\n## Mechanism\nCarbohydrate metabolism의 coenzyme (glucose → energy). 부족하면 brain이 energy 못 만듦 → Wernicke’s (confusion, ataxia, eye movement 이상)\n## Side effects\n• Generally very safe\n• intravenous (IV) → rare anaphylaxis, injection site pain",key:""},{id:"M44",deck:"other",tag:"Other ward meds",q:"Tamsulosin",ko:"Flomax",a:"## Class\nAlpha-1A blocker\n접미사: -osin\n## Indication\nbenign prostatic hyperplasia (BPH) symptoms, post-operative urinary retention, before trial without catheter (TWOC), ureteric stones\n## Mechanism\nProstate · bladder neck의 alpha-1A receptor block → smooth muscle relaxation → urine flow ↑\n## Side effects\n• Postural hypotension, dizziness → falls\n• Retrograde ejaculation\n• Floppy iris syndrome (cataract surgery 시 알려야)",key:""},{id:"M45",deck:"other",tag:"Other ward meds",q:"Oxybutynin",ko:"Ditropan",a:"## Class\nAntimuscarinic (anticholinergic)\n접미사: —\n## Indication\nBladder spasm (post-transurethral resection of the prostate (TURP), indwelling catheter (IDC) 있을 때), overactive bladder, urge incontinence\n## Mechanism\nDetrusor muscle의 muscarinic receptor block → bladder relaxation → spasm · urgency ↓\n## Side effects\n• Dry mouth, constipation, blurred vision\n• Urinary retention\n• Elderly → confusion / delirium (anticholinergic burden)",key:""},{id:"M46",deck:"other",tag:"Other ward meds",q:"Ferric carboxymaltose (IV iron)",ko:"Ferinject",a:"## Class\nIV iron replacement\n접미사: —\n## Indication\nIron deficiency anaemia pre- / post-operative (Patient Blood Management) → transfusion ↓. Joint replacement 후 흔함\n## Mechanism\nIron stores 빠르게 보충 → bone marrow의 haemoglobin synthesis ↑ → Hb ↑ (몇 주에 걸쳐)\n## Side effects\n• Hypersensitivity (rare but serious)\n• Hypophosphataemia\n• Extravasation → permanent brown skin staining\n• Headache, flu-like symptoms, metallic taste",key:""}]})</script><script>window.PACKS.push({id:"rehab",name:"진희 REHAB 약",desc:"Rehab 병동 약 · 사용, 작용, 부작용·간호 + 약 용어",decks:[{id:"s1",name:"통증 · 염증",short:"통증·염증"},{id:"s2",name:"류마티스 관절염",short:"류마티스"},{id:"s3",name:"심혈관 · 혈액",short:"심혈관"},{id:"s4",name:"호흡",short:"호흡"},{id:"s5",name:"신경 · 기분 · 수면",short:"신경·수면"},{id:"s6",name:"위장 · 배변",short:"위장"},{id:"s7",name:"비타민 · 미네랄 · 뼈",short:"비타민·뼈"},{id:"s8",name:"비뇨",short:"비뇨"},{id:"s9",name:"당뇨 · 호르몬",short:"당뇨·호르몬"},{id:"s10",name:"심혈관 · 응고 · 통풍 추가",short:"심장·통풍+"},{id:"s11",name:"기타 자주 보는 약",short:"기타"},{id:"s12",name:"약 용어 정리",short:"약 용어"}],cards:[{id:"D01",deck:"s1",tag:"통증 · 염증",q:"Paracetamol (Panadol), Panadol Osteo SR 665 mg",ko:"",a:"## Class\nanalgesic (진통제)\n## Indication · Mechanism\nRegular baseline pain relief. Reduces prostaglandin in the brain.\n기본 진통. 뇌에서 prostaglandin ↓\n## Side effects · Nursing\n• Liver toxicity. Max 4 g/day, count all products\n• don't crush SR\n간독성. 하루 최대 4 g, 복합제 합산, SR 갈지 않기",key:""},{id:"D02",deck:"s1",tag:"통증 · 염증",q:"Oxycodone IR (Endone)",ko:"",a:"## Class\nopioid, S8\n## Indication · Mechanism\nModerate–severe pain, PRN. μ-opioid agonist.\n중등도–심한 통증 PRN. μ 수용체 작용\n## Side effects · Nursing\n• Sedation, constipation, respiratory depression\n• check sedation score & RR\n졸림, 변비, 호흡 억제. Sedation score · RR 확인",key:""},{id:"D03",deck:"s1",tag:"통증 · 염증",q:"Tapentadol IR / Palexia SR",ko:"",a:"## Class\nopioid, S8\n## Indication · Mechanism\nModerate–severe pain. μ-agonist + noradrenaline reuptake inhibitor.\nμ 수용체 + 노르아드레날린 재흡수 억제\n## Side effects · Nursing\n• Sedation, nausea, constipation\n• serotonin syndrome with SSRI/SNRI\n• don't crush SR\n졸림, 오심, 변비. SSRI · SNRI와 serotonin syndrome, SR 갈지 않기",key:""},{id:"D04",deck:"s1",tag:"통증 · 염증",q:"Targin (oxycodone + naloxone SR)",ko:"",a:"## Class\nopioid, S8\n## Indication · Mechanism\nOngoing pain. Naloxone acts only in the gut to reduce constipation.\n지속 통증. Naloxone은 장에서만 작용해 변비 ↓\n## Side effects · Nursing\n• Sedation, respiratory depression\n• don't crush\n졸림, 호흡 억제, 갈지 않기",key:""},{id:"D05",deck:"s1",tag:"통증 · 염증",q:"Buprenorphine SL / patch (Norspan)",ko:"",a:"## Class\npartial opioid agonist, S8\n## Indication · Mechanism\nPRN or background pain. Partial μ agonist.\nPRN 또는 지속 통증. μ 부분 작용\n## Side effects · Nursing\n• Drowsiness, nausea\n• SL dissolves under the tongue, don't swallow\n졸림, 오심. SL은 혀 밑에서 녹이기",key:""},{id:"D06",deck:"s1",tag:"통증 · 염증",q:"Tramadol (IR / SR)",ko:"",a:"## Class\nweak opioid + SNRI\n## Indication · Mechanism\nModerate pain. Weak μ agonist + serotonin/noradrenaline reuptake inhibitor.\n중등도 통증. 약한 μ + 세로토닌 · 노르아드레날린\n## Side effects · Nursing\n• Nausea, dizziness, seizures, serotonin syndrome with SSRI/SNRI\n오심, 어지러움, 경련, serotonin syndrome",key:""},{id:"D07",deck:"s1",tag:"통증 · 염증",q:"Celecoxib, Meloxicam, Diclofenac, Ibuprofen",ko:"",a:"## Class\nNSAID\n## Indication · Mechanism\nArthritis, post-op pain and inflammation. Inhibit COX → prostaglandin ↓.\n관절염 · 수술 후 통증 · 염증. COX 억제\n## Side effects · Nursing\n• GI bleeding, kidney injury, BP ↑\n• give with food\n• caution in elderly, HF, anticoagulants\n위장 출혈, 신장 ↓, 혈압 ↑. 음식과 함께",key:""},{id:"D08",deck:"s1",tag:"통증 · 염증",q:"Pregabalin, Gabapentin",ko:"",a:"## Class\ngabapentinoid\n## Indication · Mechanism\nNeuropathic pain. Bind nerve calcium channels (α2δ) → fewer pain signals.\n신경병증 통증. 칼슘 채널에 붙어 신호 ↓\n## Side effects · Nursing\n• Dizziness, drowsiness → falls\n• dose by kidney function\n어지러움, 졸림 → 낙상. 신장 기능 따라 용량",key:""},{id:"D09",deck:"s1",tag:"통증 · 염증",q:"Duloxetine",ko:"",a:"## Class\nSNRI\n## Indication · Mechanism\nDepression + chronic pain (OA, neuropathy). Serotonin & noradrenaline reuptake inhibitor.\n우울 + 만성 통증\n## Side effects · Nursing\n• Nausea, dizziness, low sodium\n• don't stop suddenly\n오심, 저나트륨, 갑자기 끊지 않기",key:""},{id:"D10",deck:"s1",tag:"통증 · 염증",q:"Lidocaine 5% patch (Versatis)",ko:"",a:"## Class\nlocal anaesthetic\n## Indication · Mechanism\nLocalised nerve pain (e.g. post-herpetic). Blocks sodium channels in skin nerves.\n국소 신경통. 피부 신경의 나트륨 채널 차단\n## Side effects · Nursing\n• Skin irritation\n• usually 12 h on, 12 h off\n피부 자극. 보통 12시간 붙이고 12시간 뗌",key:""},{id:"D11",deck:"s1",tag:"통증 · 염증",q:"Colchicine",ko:"",a:"## Class\nanti-gout\n## Indication · Mechanism\nGout flare treatment/prevention. Inhibits white cell function → inflammation ↓.\n통풍 발작 치료 · 예방\n## Side effects · Nursing\n• Diarrhoea, nausea\n• exact dosing (toxic in overdose), drug interactions\n설사, 과량 독성, 상호작용",key:""},{id:"D12",deck:"s2",tag:"류마티스 관절염",q:"Methotrexate (brand: Methoblastin)",ko:"",a:"## Class\nDMARD\n## Indication · Mechanism\nRA. Blocks folate metabolism → immune activity ↓.\n엽산 대사 억제 → 면역 · 염증 ↓\n## Side effects · Nursing\n• Bone marrow suppression, liver toxicity, mouth ulcers, infection. ONCE WEEKLY only (daily dosing can kill)\n• cytotoxic handling\n주 1회만, cytotoxic 취급",key:""},{id:"D13",deck:"s2",tag:"류마티스 관절염",q:"Folic acid 5 mg",ko:"",a:"## Class\nvitamin B9\n## Indication · Mechanism\nReduces methotrexate side effects.\nMTX 부작용 ↓\n## Side effects · Nursing\n• Minimal\n• usually on a different day from MTX — check chart\n보통 MTX와 다른 요일, 차트 확인",key:""},{id:"D14",deck:"s2",tag:"류마티스 관절염",q:"Adalimumab (Humira) 40 mg/0.4 mL SC",ko:"",a:"## Class\nbiologic DMARD (TNF-α inhibitor)\n## Indication · Mechanism\nRA and other inflammatory diseases. Blocks TNF-α.\n염증 물질 TNF-α 차단\n## Side effects · Nursing\n• Infection (incl. TB), injection-site reaction\n• keep refrigerated\n감염, 냉장 보관",key:""},{id:"D15",deck:"s2",tag:"류마티스 관절염",q:"Upadacitinib (Rinvoq)",ko:"",a:"## Class\nJAK inhibitor\n## Indication · Mechanism\nRA. Blocks JAK inflammatory signalling inside cells.\n세포 안 JAK 신호 차단\n## Side effects · Nursing\n• Infection, shingles, VTE risk, cholesterol ↑\n감염, 대상포진, VTE 위험",key:""},{id:"D16",deck:"s3",tag:"심혈관 · 혈액",q:"Bisoprolol, Metoprolol",ko:"",a:"## Class\nbeta-blocker\n## Indication · Mechanism\nHypertension, HF, AF rate control. β1 block → HR & BP ↓.\nβ1 차단 → 맥박 · 혈압 ↓\n## Side effects · Nursing\n• Bradycardia, hypotension, fatigue\n• check HR & BP before giving\n서맥, 저혈압. 주기 전 HR · BP",key:""},{id:"D17",deck:"s3",tag:"심혈관 · 혈액",q:"Ramipril, Perindopril / amlodipine",ko:"",a:"## Class\nACE inhibitor (+ CCB)\n## Indication · Mechanism\nHypertension, HF. Angiotensin II ↓ → vessels relax; amlodipine blocks calcium channels.\n혈관 확장\n## Side effects · Nursing\n• Dry cough, high K+, kidney function, postural drop\n• amlodipine ankle swelling\n마른기침, 고칼륨, 기립성 저혈압, 발목 부종",key:""},{id:"D18",deck:"s3",tag:"심혈관 · 혈액",q:"Furosemide",ko:"",a:"## Class\nloop diuretic\n## Indication · Mechanism\nHF, oedema. Blocks Na reabsorption in the loop of Henle → more urine.\nNa 재흡수 억제 → 소변 ↑\n## Side effects · Nursing\n• Dehydration, low K+, hypotension, urgency → falls\n• give in the morning, daily weight & fluid balance\n탈수, 저칼륨, 낙상. 아침에, 체중 · I/O",key:""},{id:"D19",deck:"s3",tag:"심혈관 · 혈액",q:"Rosuvastatin, Atorvastatin",ko:"",a:"## Class\nstatin\n## Indication · Mechanism\nLowers cholesterol, prevents MI/stroke. Inhibits HMG-CoA reductase.\n콜레스테롤 ↓\n## Side effects · Nursing\n• Muscle pain (rarely rhabdomyolysis), liver enzymes\n근육통, 간 수치",key:""},{id:"D20",deck:"s3",tag:"심혈관 · 혈액",q:"Ezetimibe",ko:"",a:"## Class\ncholesterol absorption inhibitor\n## Indication · Mechanism\nAdded to a statin. Blocks cholesterol absorption in the gut.\n장에서 흡수 ↓\n## Side effects · Nursing\n• Usually well tolerated\n대체로 잘 견딤",key:""},{id:"D21",deck:"s3",tag:"심혈관 · 혈액",q:"Aspirin 100 mg",ko:"",a:"## Class\nantiplatelet\n## Indication · Mechanism\nMI/stroke prevention; sometimes VTE prevention after joint surgery. Irreversible COX-1 block → platelets stick less.\n혈소판 응집 ↓\n## Side effects · Nursing\n• Bleeding, gastric irritation\n• give with food\n출혈, 위 자극",key:""},{id:"D22",deck:"s3",tag:"심혈관 · 혈액",q:"Clopidogrel",ko:"",a:"## Class\nantiplatelet (P2Y12 inhibitor)\n## Indication · Mechanism\nStroke/MI prevention, after stents. Blocks platelet ADP receptor.\n뇌졸중 · 심근경색 예방\n## Side effects · Nursing\n• Bleeding, bruising\n• often stopped before surgery\n출혈, 멍",key:""},{id:"D23",deck:"s3",tag:"심혈관 · 혈액",q:"Enoxaparin (Clexane)",ko:"",a:"## Class\nLMWH\n## Indication · Mechanism\nVTE prevention/treatment. Inhibits factor Xa via antithrombin.\nfactor Xa 억제\n## Side effects · Nursing\n• Bleeding, low platelets (HIT)\n• SC into abdomen, don't rub\n출혈, HIT, 복부 SC 문지르지 않기",key:""},{id:"D24",deck:"s3",tag:"심혈관 · 혈액",q:"Apixaban, Rivaroxaban",ko:"",a:"## Class\nDOAC (factor Xa inhibitor)\n## Indication · Mechanism\nVTE prevention after THR/TKR, AF stroke prevention, VTE treatment.\n관절 수술 후 VTE 예방, AF\n## Side effects · Nursing\n• Bleeding\n• don't miss doses\n• report black stools, bruising, falls with head strike\n출혈, 투여 누락 X, 낙상 시 머리 부딪힘 보고",key:""},{id:"D25",deck:"s3",tag:"심혈관 · 혈액",q:"Tranexamic acid",ko:"",a:"## Class\nantifibrinolytic\n## Indication · Mechanism\nReduces bleeding after joint surgery. Stops clots being broken down (plasmin ↓).\n혈전 분해 억제 → 출혈 ↓\n## Side effects · Nursing\n• Nausea\n• clot risk (caution with VTE history)\n• dose by kidney function\n혈전 위험",key:""},{id:"D26",deck:"s4",tag:"호흡",q:"Budesonide / eformoterol (Symbicort)",ko:"",a:"## Class\nICS + LABA\n## Indication · Mechanism\nAsthma, COPD. Reduces airway inflammation + opens airways.\n기도 염증 ↓ + 기관지 확장\n## Side effects · Nursing\n• Oral thrush, hoarse voice → rinse mouth after use\n• tremor\n구강 칸디다 → 입 헹구기",key:""},{id:"D27",deck:"s4",tag:"호흡",q:"Tiotropium / olodaterol (Spiolto)",ko:"",a:"## Class\nLAMA + LABA\n## Indication · Mechanism\nCOPD. Muscarinic block + β2 stimulation → bronchodilation.\n기관지 확장\n## Side effects · Nursing\n• Dry mouth, urinary retention\n• 2 puffs once daily\n입 마름, 요정체",key:""},{id:"D28",deck:"s5",tag:"신경 · 기분 · 수면",q:"Levodopa (Sinemet, Madopar)",ko:"",a:"## Class\nantiparkinson\n## Indication · Mechanism\nParkinson's. Converted to dopamine in the brain.\n뇌에서 도파민으로 바뀜\n## Side effects · Nursing\n• Time-critical: give on time\n• nausea, postural hypotension, dyskinesia\n• avoid metoclopramide, prochlorperazine, haloperidol\n제시간에, 피해야 할 약 3가지",key:""},{id:"D29",deck:"s5",tag:"신경 · 기분 · 수면",q:"Baclofen",ko:"",a:"## Class\nmuscle relaxant (GABA-B agonist)\n## Indication · Mechanism\nSpasticity after stroke, MS, spinal injury.\n경직\n## Side effects · Nursing\n• Drowsiness, weakness\n• don't stop suddenly (withdrawal seizures)\n졸림, 갑자기 끊지 않기",key:""},{id:"D30",deck:"s5",tag:"신경 · 기분 · 수면",q:"Levetiracetam (Keppra)",ko:"",a:"## Class\nantiepileptic\n## Indication · Mechanism\nSeizures (e.g. after stroke or brain injury). Modulates synaptic release (SV2A).\n뇌졸중 · 뇌손상 후 경련\n## Side effects · Nursing\n• Drowsiness, irritability/mood change\n• give on time, don't stop suddenly\n졸림, 기분 변화, 제시간",key:""},{id:"D31",deck:"s5",tag:"신경 · 기분 · 수면",q:"Escitalopram, Sertraline",ko:"",a:"## Class\nSSRI\n## Indication · Mechanism\nDepression/anxiety, incl. post-stroke depression. Serotonin reuptake inhibitor.\n세로토닌 재흡수 억제\n## Side effects · Nursing\n• Nausea, low sodium, bleeding ↑ with antiplatelets/anticoagulants, falls\n• escitalopram QT prolongation\n저나트륨, 출혈 ↑, 낙상",key:""},{id:"D32",deck:"s5",tag:"신경 · 기분 · 수면",q:"Venlafaxine XR (Efexor-XR)",ko:"",a:"## Class\nSNRI\n## Indication · Mechanism\nDepression/anxiety. Serotonin + noradrenaline reuptake inhibitor.\n우울 · 불안\n## Side effects · Nursing\n• Nausea, BP ↑, low sodium\n• swallow whole, don't stop suddenly\n혈압 ↑, 통째로, 갑자기 끊지 않기",key:""},{id:"D33",deck:"s5",tag:"신경 · 기분 · 수면",q:"Mirtazapine",ko:"",a:"## Class\nantidepressant (NaSSA)\n## Indication · Mechanism\nDepression with poor sleep/appetite. ↑ serotonin & noradrenaline, blocks histamine.\n우울 + 불면 · 식욕 저하\n## Side effects · Nursing\n• Drowsiness (so given nocte), appetite & weight ↑, falls\n졸림 → nocte, 체중 ↑",key:""},{id:"D34",deck:"s5",tag:"신경 · 기분 · 수면",q:"Temazepam",ko:"",a:"## Class\nbenzodiazepine, S4\n## Indication · Mechanism\nShort-term insomnia. Enhances GABA.\n단기 불면\n## Side effects · Nursing\n• Sedation, confusion, falls, dependence\n• avoid in elderly where possible\n진정, 혼란, 낙상, 의존",key:""},{id:"D35",deck:"s5",tag:"신경 · 기분 · 수면",q:"Quetiapine",ko:"",a:"## Class\natypical antipsychotic\n## Indication · Mechanism\nSevere agitation/psychosis in delirium or dementia (short term, specialist advice).\n심한 초조 · 정신증\n## Side effects · Nursing\n• Sedation, postural hypotension, falls\n• avoid in Parkinson's unless advised\n진정, 기립성 저혈압, 낙상",key:""},{id:"D36",deck:"s6",tag:"위장 · 배변",q:"Pantoprazole",ko:"",a:"## Class\nPPI\n## Indication · Mechanism\nStomach protection (with NSAID/aspirin), reflux. Blocks the proton pump → acid ↓.\n위산 ↓\n## Side effects · Nursing\n• Headache, diarrhoea\n• long-term low Mg, C. diff\n• give before breakfast\n장기: 저마그네슘, 아침 식전",key:""},{id:"D37",deck:"s6",tag:"위장 · 배변",q:"Ondansetron",ko:"",a:"## Class\n5-HT3 antagonist (antiemetic)\n## Indication · Mechanism\nNausea from opioids/surgery. Blocks 5-HT3 in gut and brain.\n오심 · 구토\n## Side effects · Nursing\n• Constipation, headache, QT prolongation\n• doesn't block dopamine, so often preferred in Parkinson's\n변비, QT. Parkinson's에 metoclopramide 대신",key:""},{id:"D38",deck:"s6",tag:"위장 · 배변",q:"Movicol",ko:"",a:"## Class\nosmotic laxative (macrogol)\n## Indication · Mechanism\nOpioid constipation. Holds water in the bowel → softer stool.\n장에 물 붙잡기\n## Side effects · Nursing\n• Bloating, diarrhoea\n• dissolve each sachet in 125 mL water\n1포 = 물 125 mL",key:""},{id:"D39",deck:"s6",tag:"위장 · 배변",q:"Lactulose",ko:"",a:"## Class\nosmotic laxative\n## Indication · Mechanism\nConstipation (also hepatic encephalopathy). Draws water into the bowel.\n변비\n## Side effects · Nursing\n• Wind, cramps, diarrhoea\n• needs good fluid intake\n가스, 복통, 수분 섭취",key:""},{id:"D40",deck:"s6",tag:"위장 · 배변",q:"Coloxyl with senna",ko:"",a:"## Class\nsoftener + stimulant\n## Indication · Mechanism\nConstipation prevention with opioids. Docusate softens, senna stimulates the bowel.\n변 연화 + 장운동 자극\n## Side effects · Nursing\n• Cramps, diarrhoea\n복통, 설사",key:""},{id:"D41",deck:"s7",tag:"비타민 · 미네랄 · 뼈",q:"Ferro-grad C",ko:"",a:"## Class\noral iron + vitamin C\n## Indication · Mechanism\nIron-deficiency anaemia after surgery. Vitamin C ↑ absorption.\n수술 후 빈혈\n## Side effects · Nursing\n• Constipation, black stools\n• don't crush\n• separate from calcium/antacids\n변비, 검은 변, 칼슘과 간격",key:""},{id:"D42",deck:"s7",tag:"비타민 · 미네랄 · 뼈",q:"Ferric carboxymaltose (Ferinject) IV",ko:"",a:"## Class\nIV iron\n## Indication · Mechanism\nFaster iron replacement (low Hb after surgery).\n빠른 철분 보충\n## Side effects · Nursing\n• Infusion reaction, low phosphate\n• observe during infusion\n주입 반응, 관찰",key:""},{id:"D43",deck:"s7",tag:"비타민 · 미네랄 · 뼈",q:"Vitamin D (colecalciferol)",ko:"",a:"## Class\nvitamin D3\n## Indication · Mechanism\nDeficiency, osteoporosis, falls/fracture prevention. ↑ calcium absorption.\n칼슘 흡수 ↑\n## Side effects · Nursing\n• Minimal (high calcium if overdosed)\n거의 없음",key:""},{id:"D44",deck:"s7",tag:"비타민 · 미네랄 · 뼈",q:"Calcium carbonate (Caltrate)",ko:"",a:"## Class\ncalcium supplement\n## Indication · Mechanism\nOsteoporosis with vitamin D.\n골다공증\n## Side effects · Nursing\n• Constipation\n• separate from iron, thyroxine, some antibiotics\n변비, 철분 · 갑상선약과 간격",key:""},{id:"D45",deck:"s7",tag:"비타민 · 미네랄 · 뼈",q:"Alendronate (Fosamax)",ko:"",a:"## Class\nbisphosphonate\n## Indication · Mechanism\nOsteoporosis after fragility fracture. Slows bone breakdown.\n뼈 흡수 ↓\n## Side effects · Nursing\n• Oesophageal irritation\n• empty stomach, full glass of water, stay upright 30 min\n아침 공복, 물 한 컵, 30분 앉아 있기",key:""},{id:"D46",deck:"s7",tag:"비타민 · 미네랄 · 뼈",q:"Denosumab (Prolia) 60 mg SC",ko:"",a:"## Class\nRANKL inhibitor\n## Indication · Mechanism\nOsteoporosis. Inhibits osteoclasts.\n파골세포 억제\n## Side effects · Nursing\n• Low calcium, rarely jaw osteonecrosis\n• every 6 months, don't delay\n저칼슘, 6개월마다",key:""},{id:"D47",deck:"s7",tag:"비타민 · 미네랄 · 뼈",q:"Magnesium",ko:"",a:"## Class\nmineral\n## Indication · Mechanism\nLow Mg (diuretics, PPI), cramps.\n저마그네슘\n## Side effects · Nursing\n• Diarrhoea\n설사",key:""},{id:"D48",deck:"s7",tag:"비타민 · 미네랄 · 뼈",q:"Thiamine",ko:"",a:"## Class\nvitamin B1\n## Indication · Mechanism\nAlcohol/poor nutrition, prevents Wernicke's.\nWernicke 예방\n## Side effects · Nursing\n• Minimal\n• give before glucose in at-risk patients\n위험 환자는 포도당 전에",key:""},{id:"D49",deck:"s7",tag:"비타민 · 미네랄 · 뼈",q:"Hydroxocobalamin 1 mg IM",ko:"",a:"## Class\nvitamin B12\n## Indication · Mechanism\nB12 deficiency (pernicious anaemia, gastric surgery, long-term metformin).\nB12 결핍\n## Side effects · Nursing\n• Injection-site pain, red urine (harmless)\n주사 부위 통증, 붉은 소변 무해",key:""},{id:"D50",deck:"s8",tag:"비뇨",q:"Duodart (dutasteride + tamsulosin)",ko:"",a:"## Class\n5α-reductase inhibitor + alpha blocker\n## Indication · Mechanism\nBPH. Shrinks prostate + relaxes bladder outlet.\n전립선 ↓ + 방광 출구 이완\n## Side effects · Nursing\n• Postural hypotension\n• swallow whole\n• women shouldn't handle leaking capsules\n기립성 저혈압, 통째로, 새는 캡슐 만지지 않기",key:""},{id:"D51",deck:"s8",tag:"비뇨",q:"Oxybutynin",ko:"",a:"## Class\nanticholinergic\n## Indication · Mechanism\nOveractive bladder, urge incontinence. Relaxes bladder muscle.\n과민성 방광\n## Side effects · Nursing\n• Dry mouth, constipation, retention, confusion in elderly\n입 마름, 변비, 노인 혼란",key:""},{id:"D52",deck:"s9",tag:"당뇨 · 호르몬",q:"Metformin",ko:"",a:"## Class\nbiguanide\n## Indication · Mechanism\nType 2 diabetes. Reduces glucose made by the liver, improves insulin sensitivity.\n간의 포도당 생성 ↓, 인슐린 감수성 ↑\n## Side effects · Nursing\n• Nausea, diarrhoea, low B12\n• give with meals\n• withhold if dehydrated or acute kidney injury (lactic acidosis risk)\n위장 장애, 식사와 함께, 탈수 · 신장 손상 시 보류",key:""},{id:"D53",deck:"s9",tag:"당뇨 · 호르몬",q:"Gliclazide",ko:"",a:"## Class\nsulfonylurea\n## Indication · Mechanism\nType 2 diabetes. Makes the pancreas release more insulin.\n췌장에서 인슐린 분비 ↑\n## Side effects · Nursing\n• Hypoglycaemia (esp. elderly, missed meals)\n• give with breakfast, check BGL\n저혈당, 아침 식사와 함께, BGL 확인",key:""},{id:"D54",deck:"s9",tag:"당뇨 · 호르몬",q:"Insulin (NovoRapid, Lantus, Protaphane)",ko:"",a:"## Class\nhormone\n## Indication · Mechanism\nDiabetes. Moves glucose into cells → BGL ↓.\n포도당을 세포로 이동 → 혈당 ↓\n## Side effects · Nursing\n• Hypoglycaemia\n• check BGL first\n• rapid-acting with meals\n• high-risk drug, double check\n저혈당, 투여 전 BGL, 고위험 약 2인 확인 · Day 6",key:""},{id:"D55",deck:"s9",tag:"당뇨 · 호르몬",q:"Prednisolone",ko:"",a:"## Class\ncorticosteroid\n## Indication · Mechanism\nCOPD/asthma flare, RA, gout. Strongly reduces inflammation and immune activity.\n염증 · 면역 강하게 억제\n## Side effects · Nursing\n• High BGL, infection, insomnia/mood change, bone loss\n• give in the morning with food\n• don't stop suddenly after long use\n고혈당, 감염, 불면, 아침에 음식과, 장기 사용 후 갑자기 끊지 않기",key:""},{id:"D56",deck:"s9",tag:"당뇨 · 호르몬",q:"Levothyroxine (Eutroxsig, Oroxine)",ko:"",a:"## Class\nthyroid hormone\n## Indication · Mechanism\nHypothyroidism. Replaces thyroid hormone.\n갑상선 호르몬 보충\n## Side effects · Nursing\n• Too much → palpitations, AF, weight loss\n• empty stomach 30–60 min before breakfast\n• separate from calcium/iron by 4 h\n공복 복용, 칼슘 · 철분과 4시간 간격",key:""},{id:"D57",deck:"s10",tag:"심혈관 · 응고 · 통풍 추가",q:"Warfarin",ko:"",a:"## Class\nvitamin K antagonist\n## Indication · Mechanism\nAF, VTE, mechanical heart valves. Blocks vitamin K–dependent clotting factors.\n비타민 K 의존 응고인자 억제\n## Side effects · Nursing\n• Bleeding\n• dose by INR\n• many drug & diet (vitamin K) interactions\n• reversal: vitamin K\n출혈, INR로 용량, 상호작용 많음 · Day 7",key:""},{
